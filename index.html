        function updateGradeMonthPreview() {
            const daily = document.getElementById('grade-editor-daily');
            const paper = document.getElementById('grade-editor-paper');
            const preview = document.getElementById('grade-editor-total-preview');
            if (!daily || !paper || !preview) return;
            preview.textContent = daily.value !== '' || paper.value !== ''
                ? gradeDisplay((daily.value === '' ? 0 : Number(daily.value) || 0) + (paper.value === '' ? 0 : Number(paper.value) || 0))
                : '—';
        }

        function clearGradeEditorCurrentMonth() {
            if (!currentGradeEditContext || ![0, 2].includes(currentGradeEditContext.period)) return;
            const student = appState.students.find(item => String(item.id) === String(currentGradeEditContext.studentId));
            if (!student) return;
            if (!confirm('هل أنت متأكد من مسح درجة هذا الشهر؟ لا يمكن التراجع عن الحذف.')) return;
            const record = getStudentGradeRecord(student, currentGradeEditContext.subjectName);
            const prefix = currentGradeEditContext.period === 0 ? 'term1' : 'term2';
            const month = currentGradeEditContext.month;
            record[`${prefix}Month${month}`] = '';
            record[`${prefix}Month${month}Daily`] = '';
            record[`${prefix}Month${month}Paper`] = '';
            persistLocalState();
            closeModal();
            renderGradesContent();
            showToast('تم مسح درجة الشهر');
        }

        function saveGradeEditor() {
            if (!currentGradeEditContext) return;
            const context = currentGradeEditContext;
            const student = appState.students.find(item => String(item.id) === String(context.studentId));
            if (!student) { showToast('تعذر العثور على الطالب', 'error'); return; }
            const record = getStudentGradeRecord(student, context.subjectName);
            if (context.period === 0 || context.period === 2) {
                const prefix = context.period === 0 ? 'term1' : 'term2';
                const month = context.month;
                const dailyInput = document.getElementById('grade-editor-daily');
                const paperInput = document.getElementById('grade-editor-paper');
                if (!dailyInput || !paperInput) return;
                const dailyRaw = dailyInput.value.trim(), paperRaw = paperInput.value.trim();
                const dailyKey = `${prefix}Month${month}Daily`, paperKey = `${prefix}Month${month}Paper`, totalKey = `${prefix}Month${month}`;
                if (dailyRaw !== '' || paperRaw !== '') {
                    const daily = dailyRaw === '' ? null : Number(dailyRaw);
                    const paper = paperRaw === '' ? null : Number(paperRaw);
                    if ((daily !== null && (!Number.isFinite(daily) || daily < 0 || daily > 50)) ||
                        (paper !== null && (!Number.isFinite(paper) || paper < 0 || paper > 50))) {
                        showToast('يجب أن تكون كل درجة مُدخلة بين 0 و50', 'error'); return;
                    }
                    record[dailyKey] = daily === null ? '' : daily;
                    record[paperKey] = paper === null ? '' : paper;
                    record[totalKey] = (daily === null ? 0 : daily) + (paper === null ? 0 : paper);
                } else {
                    // Preserve legacy monthly totals unless the user explicitly clears an existing daily/paper breakdown.
                    if (gradeRecordHasValue(record[dailyKey]) || gradeRecordHasValue(record[paperKey])) {
                        record[dailyKey] = '';
                        record[paperKey] = '';
                        record[totalKey] = '';
                    }
                }
            } else if (context.period === 1) {
                const input = document.getElementById('grade-editor-midyear');
                if (!input) return;
                if (input.value.trim() !== '') {
                    const value = Number(input.value);
                    if (!Number.isFinite(value) || value < 0 || value > 100) { showToast('درجة نصف السنة يجب أن تكون بين 0 و100', 'error'); return; }
                    record.midyearMode = 'direct';
                    record.midyearDirect = value;
                } else {
                    record.midyearMode = 'direct';
                    record.midyearDirect = '';
                }
            } else if (context.period === 4) {
                const input = document.getElementById('grade-editor-final');
                if (!input) return;
                if (input.value.trim() !== '') {
                    const value = Number(input.value);
                    if (!Number.isFinite(value) || value < 0 || value > 100) { showToast('درجة الامتحان النهائي يجب أن تكون بين 0 و100', 'error'); return; }
                    record.finalExam = value;
                } else record.finalExam = '';
            }
            persistLocalState();
            closeModal();
            currentGradeEditContext = null;
            renderGradesContent();
            showToast('تم حفظ درجة الطالب وتحديث الحسابات');
        }

        // --- Subject-aware report filters (used by all report categories) ---
        let activeReportKey = '';

        function normalizeReportValue(value) {
            return String(value == null ? '' : value).trim().toLocaleLowerCase('ar');
        }

        function getReportSubjectNames() {
            const names = new Set();
            (appState.subjectCatalog || []).forEach(item => { if (item && item.name) names.add(String(item.name).trim()); });
            (appState.subjects || []).forEach(item => { if (item && item.name) names.add(String(item.name).trim()); });
            (appState.students || []).forEach(student => {
                if (student && student.subject) names.add(String(student.subject).trim());
                (student && Array.isArray(student.behaviorLog) ? student.behaviorLog : []).forEach(log => {
                    if (log && log.subject) names.add(String(log.subject).trim());
                });
            });
            (appState.savedSessions || []).forEach(session => { if (session && session.subject) names.add(String(session.subject).trim()); });
            (appState.schedule || []).forEach(item => { if (item && item.subject) names.add(String(item.subject).trim()); });
            names.delete('');
            return Array.from(names).sort((a, b) => a.localeCompare(b, 'ar'));
        }

        function getSelectedReportSubject() {
            const select = document.getElementById('rep-subject-filter');
            return select ? select.value : 'all';
        }

        function getReportClassParts(classFilterVal = 'all') {
            if (!classFilterVal || classFilterVal === 'all') return null;
            const parts = String(classFilterVal).split(' - ');
            return {
                name: (parts[0] || '').trim(),
                section: (parts[1] || '').trim(),
                studyType: (parts.slice(2).join(' - ') || 'صباحي').trim()
            };
        }

        function reportStudentMatchesClass(student, classFilterVal = 'all') {
            const parts = getReportClassParts(classFilterVal);
            if (!parts) return true;
            return normalizeReportValue(student && student.class) === normalizeReportValue(parts.name) &&
                normalizeReportValue(student && student.section) === normalizeReportValue(parts.section) &&
                normalizeReportValue((student && student.studyType) || 'صباحي') === normalizeReportValue(parts.studyType || 'صباحي');
        }

        function reportClassMatchesSession(session, classFilterVal) {
            const parts = getReportClassParts(classFilterVal);
            if (!parts) return true;
            return normalizeReportValue(session && session.className) === normalizeReportValue(parts.name) &&
                normalizeReportValue(session && session.section) === normalizeReportValue(parts.section) &&
                normalizeReportValue((session && session.studyType) || 'صباحي') === normalizeReportValue(parts.studyType || 'صباحي');
        }

        function reportSessionMatchesStudent(session, student) {
            return normalizeReportValue(session && session.className) === normalizeReportValue(student && student.class) &&
                normalizeReportValue(session && session.section) === normalizeReportValue(student && student.section) &&
                normalizeReportValue((session && session.studyType) || 'صباحي') === normalizeReportValue((student && student.studyType) || 'صباحي');
        }

        // يربط الطالب بالمادة عبر قائمة المواد، وبيانات الطالب، وسجلات المتابعة القديمة.
        // وجود مادة مرتبطة بصف/شعبة يتيح عرض جميع طلبة تلك الشعبة في تقرير المادة.
        function reportSubjectMatchesStudent(student, subjectName) {
            if (!subjectName || subjectName === 'all') return true;
            const wanted = normalizeReportValue(subjectName);
            const directSubjectMatch = normalizeReportValue(student && student.subject) === wanted;
            const behaviorLogs = student && Array.isArray(student.behaviorLog) ? student.behaviorLog : [];
            const behaviorMatch = behaviorLogs.some(log => normalizeReportValue(log && log.subject) === wanted);
            const linkedSubjectRecords = (appState.subjects || []).filter(item => normalizeReportValue(item && item.name) === wanted);
            const classLinkMatch = linkedSubjectRecords.some(item => {
                if (item.class && normalizeReportValue(item.class) !== normalizeReportValue(student && student.class)) return false;
                if (item.section && normalizeReportValue(item.section) !== normalizeReportValue(student && student.section)) return false;
                if (item.studyType && normalizeReportValue(item.studyType) !== normalizeReportValue((student && student.studyType) || 'صباحي')) return false;
                return Boolean(item.class);
            });
            // عند وجود ربط صريح للمادة بصف/شعبة، تكون القائمة المرجع الأساسي.
            // أما سجلات المواد القديمة التي لا تحدد صفاً، فتستخدم ربط الطالب وسجل المتابعة.
            const hasExplicitRoster = linkedSubjectRecords.some(item => String(item.class || '').trim());
            return hasExplicitRoster ? classLinkMatch : (directSubjectMatch || behaviorMatch);
        }

        function getSubjectSessions(subjectName, classFilterVal = 'all', fromDate = '', toDate = '') {
            return (appState.savedSessions || []).filter(session =>
                (!subjectName || subjectName === 'all' || normalizeReportValue(session && session.subject) === normalizeReportValue(subjectName)) &&
                reportClassMatchesSession(session, classFilterVal) &&
                (!fromDate || String(session.date || '') >= fromDate) &&
                (!toDate || String(session.date || '') <= toDate)
            );
        }

        function getReportSessionsForStudent(student, subjectName = 'all', classFilterVal = 'all', fromDate = '', toDate = '') {
            return getSubjectSessions(subjectName, classFilterVal, fromDate, toDate).filter(session => reportSessionMatchesStudent(session, student));
        }

        function getSessionTopicsForStudent(student, subjectName = 'all', classFilterVal = 'all', fromDate = '', toDate = '') {
            if (!student) return '';
            const key = String(student.id);
            const topics = getReportSessionsForStudent(student, subjectName, classFilterVal, fromDate, toDate)
                .filter(session => Object.prototype.hasOwnProperty.call(session.records || {}, key) && session.records[key])
                .map(session => String(session.topic || '').trim()).filter(Boolean);
            return [...new Set(topics)].join('، ');
        }

        function getSessionTopicForStudentDate(student, dateValue, subjectName = 'all', classFilterVal = 'all') {
            return getSessionTopicsForStudent(student, subjectName, classFilterVal, dateValue, dateValue);
        }

        function createAttendanceMetrics(attendanceCount = 0, absentCount = 0, excusedCount = 0, attendanceLogs = [], flags = {}) {
            const logs = Array.isArray(attendanceLogs) ? attendanceLogs : [];
            const absenceLogs = logs.filter(log => log && log.status === 'غائب');
            const excusedLogs = logs.filter(log => log && log.status === 'مجاز');
            const safeAttendance = Math.max(0, Number(attendanceCount) || 0);
            const safeAbsent = Math.max(0, Number(absentCount) || 0);
            const safeExcused = Math.max(0, Number(excusedCount) || 0);
            const totalLectures = safeAttendance + safeAbsent + safeExcused;
            const seenDates = new Set();
            const absenceDates = absenceLogs.map(log => `${log.day ? log.day + ' ' : ''}${log.date || ''}`.trim()).filter(Boolean).filter(date => {
                if (seenDates.has(date)) return false;
                seenDates.add(date);
                return true;
            });
            return {
                attendanceCount: safeAttendance,
                absentCount: safeAbsent,
                excusedCount: safeExcused,
                totalLectures,
                absenceRate: totalLectures ? safeAbsent / totalLectures * 100 : 0,
                absenceLogs,
                attendanceLogs: logs,
                absenceDates,
                hasSubjectRecords: Boolean(flags.hasSubjectRecords),
                hasSessionRecords: Boolean(flags.hasSessionRecords),
                hasApplicableSessions: Boolean(flags.hasApplicableSessions)
            };
        }

        function getReportSessionMetrics(student, subjectName = 'all', classFilterVal = 'all', fromDate = '', toDate = '') {
            const sessions = getReportSessionsForStudent(student, subjectName, classFilterVal, fromDate, toDate);
            let attendanceCount = 0, absentCount = 0, excusedCount = 0;
            let hasStudentRecord = false;
            const logs = [];
            sessions.forEach(session => {
                const records = session.records || {};
                const key = String(student && student.id);
                if (!Object.prototype.hasOwnProperty.call(records, key) || !records[key]) return;
                hasStudentRecord = true;
                const code = String(records[key]).toLowerCase();
                if (code === 'absent') {
                    absentCount++;
                    logs.push({ date: session.date || '', day: getDayName(session.date), status: 'غائب' });
                } else if (code === 'excused') {
                    excusedCount++;
                    logs.push({ date: session.date || '', day: getDayName(session.date), status: 'مجاز' });
                } else {
                    attendanceCount++;
                }
            });
            return createAttendanceMetrics(attendanceCount, absentCount, excusedCount, logs, {
                hasSubjectRecords: hasStudentRecord,
                hasSessionRecords: hasStudentRecord,
                hasApplicableSessions: sessions.length > 0
            });
        }

        function filterStudentsForReportSubject(students, subjectName = getSelectedReportSubject()) {
            if (!subjectName || subjectName === 'all') return students;
            return students.filter(student => reportSubjectMatchesStudent(student, subjectName));
        }

        function filterStudentsForAttendanceSubject(students, subjectName = getSelectedReportSubject(), classFilterVal = 'all', fromDate = '', toDate = '') {
            if (!subjectName || subjectName === 'all') return students;
            const sessions = getSubjectSessions(subjectName, classFilterVal, fromDate, toDate);
            const recordedIds = new Set();
            sessions.forEach(session => {
                Object.keys(session.records || {}).forEach(id => recordedIds.add(String(id)));
            });
            return students.filter(student => recordedIds.has(String(student.id)) || reportSubjectMatchesStudent(student, subjectName));
        }

        function getStudentStatusForReportDate(student, dateValue, subjectName = 'all', classFilterVal = 'all') {
            const sessions = getReportSessionsForStudent(student, subjectName, classFilterVal, dateValue, dateValue);
            const statuses = [];
            sessions.forEach(session => {
                const records = session.records || {};
                const key = String(student && student.id);
                if (!Object.prototype.hasOwnProperty.call(records, key) || !records[key]) return;
                const code = String(records[key]).toLowerCase();
                statuses.push(code === 'absent' ? 'غائب' : code === 'excused' ? 'مجاز' : 'حاضر');
            });
            if (statuses.length) {
                if (statuses.includes('غائب')) return 'غائب';
                if (statuses.includes('مجاز')) return 'مجاز';
                return 'حاضر';
            }
            if (sessions.length) return 'غير مسجل';

            const studentSubjectMatches = !subjectName || subjectName === 'all' ||
                normalizeReportValue(student && student.subject) === normalizeReportValue(subjectName);
            if (studentSubjectMatches) {
                const log = (student && Array.isArray(student.absenceLog) ? student.absenceLog : []).find(item => item && item.date === dateValue);
                if (log) return log.status || 'غير مسجل';
            }
            return 'غير مسجل';
        }

        function getLegacyStudentAttendanceMetrics(student, fromDate = '', toDate = '') {
            const allLogs = Array.isArray(student && student.absenceLog) ? student.absenceLog.filter(Boolean) : [];
            const logs = allLogs.filter(log => (!fromDate || String(log.date || '') >= fromDate) && (!toDate || String(log.date || '') <= toDate));
            const absenceLogs = logs.filter(log => log.status === 'غائب');
            const excusedLogs = logs.filter(log => log.status === 'مجاز');
            const isPeriodReport = Boolean(fromDate || toDate);
            const absentCount = isPeriodReport ? absenceLogs.length : Math.max(Number(student && student.absenceCount) || 0, absenceLogs.length);
            const excusedCount = isPeriodReport ? excusedLogs.length : Math.max(Number(student && student.excusedCount) || 0, excusedLogs.length);
            const attendanceCount = isPeriodReport ? 0 : (Number(student && student.attendanceCount) || 0);
            return createAttendanceMetrics(attendanceCount, absentCount, excusedCount, [...absenceLogs, ...excusedLogs], {});
        }

        function getSubjectAttendanceMetrics(student, subjectName, classFilterVal = 'all', fromDate = '', toDate = '') {
            const sessionMetrics = getReportSessionMetrics(student, subjectName, classFilterVal, fromDate, toDate);
            if (sessionMetrics.hasApplicableSessions) return sessionMetrics;
            // إذا لم توجد جلسات للمادة، لا نخلط أرقام مادة أخرى بها. نستخدم السجل القديم فقط عند ارتباط الطالب المباشر بالمادة.
            if (normalizeReportValue(student && student.subject) === normalizeReportValue(subjectName)) {
                return getLegacyStudentAttendanceMetrics(student, fromDate, toDate);
            }
            return createAttendanceMetrics(0, 0, 0, [], { hasSubjectRecords: false, hasSessionRecords: false, hasApplicableSessions: false });
        }

        function handleReportSubjectFilterChange() {
            const pickedSubject = getSelectedReportSubject();
            document.querySelectorAll('[id$="-strip-subject"]').forEach(el => {
                el.textContent = `المادة: ${pickedSubject === 'all' ? 'جميع المواد الدراسية' : pickedSubject}`;
            });
            const updateByKey = {
                att_absence_list: updateAbsenceListReport,
                att_by_date: updateAttByDateReport,
                att_monthly: updateMonthlyAttReport,
                grades_term_specific: updateTermSpecificGradesReport,
                grades_pursuit_report: updatePursuitReport,
                behavior_summary: updateBehaviorReport,
                all_students: updateAllStudentsReport,
                students_by_section: updateStudentsBySectionReport,
                grades_by_section: updateGradesSectionReport,
                grades_min_max: updateGradesMinMaxReport,
                grades_passed: updatePassedReport,
                grades_failed: updateFailedReport,
                att_frequent: updateFrequentAbsenceReport,
                att_exceeded: updateAttExceededReport,
                att_by_student: updateAttStudentDropdown,
                participation_report: renderParticipationReportRows
            };
            if (updateByKey[activeReportKey]) updateByKey[activeReportKey]();
            else if (activeReportKey === 'students_by_year') updateStudentsByYearReport();
            else if (activeReportKey === 'student_codes') renderStudentCodesReportRows();
            else if (activeReportKey === 'daily_grades_report') renderDailyGradesReportRows();
        }

        function updateStudentsByYearReport() {
            setPrintHeaderStageLabelUnified('dummy-st', 'all');
            const totalEl = document.getElementById('students-year-total');
            if (!totalEl) return;
            totalEl.textContent = filterStudentsForReportSubject([...appState.students]).length;
        }

        // --- 7. REPORTS TAB RENDERER ---
        function renderReportsTab(container) {
            container.innerHTML = `
                <div class="space-y-3.5">
                    <div class="flex bg-slate-200/80 p-1 rounded-2xl text-[10px] font-black text-slate-600 gap-1">
                        <button onclick="switchReportCategory('students')" id="rep-cat-btn-students" class="flex-1 py-2 rounded-xl transition-all bg-slate-900 text-amber-400 shadow-xs flex items-center justify-center gap-1">
                            <i class="fa-solid fa-users"></i>
                            <span>تقارير الطلبة</span>

        function renderReportButton(key, title, desc, icon, colorClasses) {
            return `
                <div onclick="generateReport('${key}')" class="bg-white rounded-2xl p-3 shadow-xs border border-slate-200/80 hover:border-slate-300 transition-all cursor-pointer flex items-center justify-between group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl ${colorClasses} border border-slate-100 flex items-center justify-center text-base group-hover:scale-105 transition-transform">
                            <i class="fa-solid ${icon}"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-xs text-slate-800 group-hover:text-slate-900">${title}</h4>
                            <p class="text-[10px] text-slate-400 font-medium">${desc}</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-left text-xs text-slate-300 group-hover:text-slate-600 group-hover:-translate-x-1 transition-all"></i>
                </div>
            `;
        }

        function switchReportCategory(cat) {
            ['students', 'attendance', 'grades'].forEach(c => {
                const sec = document.getElementById(`rep-section-${c}`);
                const btn = document.getElementById(`rep-cat-btn-${c}`);
                if (c === cat) {
                    sec.classList.remove('hidden');
                    btn.className = "flex-1 py-2 rounded-xl transition-all bg-slate-900 text-amber-400 font-black shadow-xs flex items-center justify-center gap-1";
                } else {
                    sec.classList.add('hidden');
                    btn.className = "flex-1 py-2 rounded-xl transition-all hover:bg-slate-300 text-slate-700 font-bold flex items-center justify-center gap-1";
                }
            });
        }

        // --- DYNAMIC REPORT GENERATOR FUNCTION ---
        function generateReport(reportKey) {
            activeReportKey = reportKey;
            currentModalType = "report_view";
            const modal = document.getElementById('action-modal');
            const box = document.getElementById('modal-box');
            const titleEl = document.getElementById('modal-title');
            const subtitleEl = document.getElementById('modal-subtitle');
            const bodyEl = document.getElementById('modal-body');
            const iconEl = document.getElementById('modal-icon');

            modal.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-95');
            box.classList.add('scale-100');

            subtitleEl.innerText = "المدرسة | كشف ومستند رسمي جاهز للطباعة وتصدير PDF";

            let classSelectOptions = appState.classes.map(c => `
                <option value="${c.name} - ${c.section} - ${c.studyType || 'صباحي'}">${c.name} (شعبة ${c.section} - ${c.studyType || 'صباحي'})</option>

                `<option value="${String(st.id)}">${st.name} (${st.class} - ${st.section})</option>`

                const info = appState.schoolInfo || {};
                const institutionParts = String(info.name || '').split(/\s*[-–—]\s*/);
                const universityName = info.name || info.school || institutionParts[0] || 'المدرسة';
                const collegeName = info.name || institutionParts[1] || 'المدرسة';
                const departmentName = info.department || 'القسم';
                let logoHtml = info.logo
                    ? `<img src="${info.logo}" style="width: 75px; height: 75px; object-fit: contain; display: block; margin: 0 auto;" class="rounded-xl">`
                    : `<div style="width: 65px; height: 65px; margin: 0 auto;" class="rounded-2xl border-2 border-slate-900 flex items-center justify-center text-slate-900 text-3xl font-black"><i class="fa-solid fa-graduation-cap"></i></div>`;

                return `
                    <!-- Print Only Official Header -->
                    <div class="print-only-header mb-2 pb-2 border-b-2 border-slate-900">
                        <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%;">

                                <div class="print-meta-line">${collegeName}</div>
                                <div class="print-meta-line">${departmentName}</div>
                                <div class="print-meta-line">${info.teacher || ''}</div>

                            <!-- الشعار في المنتصف تماماً -->

                                ${logoHtml}
                            </div>
                            
                            <!-- أعلى اليسار -->
                            <div class="text-left" style="font-size: 11pt; font-weight: bold; line-height: 1.5; color: #0f172a; white-space: nowrap !important;">
                                <div>العام الدراسي: <strong>${appState.schoolInfo.year}</strong></div>
                                <div>التاريخ: <strong>${new Date().toLocaleDateString('ar-IQ')}</strong></div>
                            </div>
                        </div>

                                <i class="fa-solid fa-print"></i> 
                                <span>طباعة / حفظ PDF</span>
                            </button>
                        </div>
                    </div>

                    <!-- فلتر المادة الدراسية موحد لجميع التقارير ويرتبط بقائمة المواد وجلسات الحضور -->

                    </div>
                    <div class="overflow-x-auto"><table class="w-full text-right"><thead class="bg-slate-900 text-amber-400 text-[10px]"><tr><th class="p-2">ت</th><th class="p-2">التاريخ</th><th class="p-2">اسم الطالب</th><th class="p-2">الصف</th><th class="p-2">الشعبة</th><th class="p-2">المادة</th><th class="p-2">الموضوع</th><th class="p-2">المشاركة</th><th class="p-2">التقييم</th><th class="p-2">الملاحظات</th></tr></thead><tbody id="participation-report-body"></tbody></table></div>`;
                renderParticipationReportRows();

        // 3. تقرير الحضور الشهري
        function updateMonthlyAttReport() {
            const classFilterVal = document.getElementById('rep-month-class').value;
            const fromDate = document.getElementById('rep-month-from').value;
            const toDate = document.getElementById('rep-month-to').value;
            const searchKey = getSearchKeyword();

            let filtered = [...appState.students];
            if (classFilterVal !== 'all') filtered = filtered.filter(student => reportStudentMatchesClass(student, classFilterVal));
            if (searchKey) filtered = filtered.filter(student => String(student.name || '').toLowerCase().includes(searchKey));
            filtered = filterStudentsForAttendanceSubject(filtered, getSelectedReportSubject(), classFilterVal, fromDate, toDate);
            filtered = sortStudentsAlphabetically(filtered);

            const selectedSubject = getSelectedReportSubject();
            const rows = filtered.map((student, index) => {
                let metrics;
                const sessionMetrics = getReportSessionMetrics(student, selectedSubject, classFilterVal, fromDate, toDate);
                if (sessionMetrics.hasApplicableSessions) {
                    metrics = sessionMetrics;
                } else if ((appState.savedSessions || []).length === 0) {
                    metrics = getLegacyStudentAttendanceMetrics(student, fromDate, toDate);
                } else if (selectedSubject !== 'all' && normalizeReportValue(student.subject) === normalizeReportValue(selectedSubject)) {
                    metrics = getLegacyStudentAttendanceMetrics(student, fromDate, toDate);
                } else {
                    // لا تُعرض الأعداد التراكمية وكأنها تخص الفترة المحددة.
                    const logs = (Array.isArray(student.absenceLog) ? student.absenceLog : []).filter(log => log &&
                        (!fromDate || String(log.date || '') >= fromDate) && (!toDate || String(log.date || '') <= toDate));
                    metrics = createAttendanceMetrics(0, logs.filter(log => log.status === 'غائب').length,
                        logs.filter(log => log.status === 'مجاز').length,
                        logs.filter(log => log.status === 'غائب' || log.status === 'مجاز'), {});
                }
                const total = metrics.totalLectures || 0;
                const rate = total ? Math.round((metrics.attendanceCount / total) * 100) : 0;
                return `
                    <tr class="border-b border-slate-100 text-[11px]">
                        <td class="p-2 font-bold text-center">${index + 1}</td>
                        <td class="p-2 font-bold text-slate-800">${escapeHtml(student.name)}</td>
                        <td class="p-2 text-[10px]">${escapeHtml(getSessionTopicsForStudent(student, selectedSubject, classFilterVal, fromDate, toDate) || '—')}</td>

                        <td class="p-2 text-center font-black text-amber-600">${metrics.excusedCount}</td>
                        <td class="p-2 text-center"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${rate >= 85 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">${rate}%</span></td>
                    </tr>
                `;
            }).join('');

            document.getElementById('att-monthly-report-body').innerHTML = rows || '<tr><td colspan="7" class="p-3 text-center text-xs text-slate-400">لا يوجد طلبة مطابقين للشروط</td></tr>';
        }

        // إحصائيات التقارير: الأولوية لجلسات الحضور المحفوظة، مع دعم سجلات الطلبة القديمة.
        function getStudentAbsenceMetrics(student, subjectName = 'all', classFilterVal = 'all', fromDate = '', toDate = '') {
            const pickedSubject = subjectName || 'all';
            const sessionMetrics = getReportSessionMetrics(student, pickedSubject, classFilterVal, fromDate, toDate);

            if (pickedSubject !== 'all') {
                if (sessionMetrics.hasApplicableSessions) return sessionMetrics;
                if (normalizeReportValue(student && student.subject) === normalizeReportValue(pickedSubject)) {
                    return getLegacyStudentAttendanceMetrics(student, fromDate, toDate);
                }
                return sessionMetrics;
            }

            const legacy = getLegacyStudentAttendanceMetrics(student, fromDate, toDate);
            if (fromDate || toDate) {
                if (sessionMetrics.hasApplicableSessions) {
                    // سجلات الغياب القديمة تُدمج مع الجلسات دون تكرار نفس الحالة في التاريخ نفسه.
                    const mergedLogs = [...sessionMetrics.attendanceLogs];
                    legacy.attendanceLogs.forEach(log => {
                        if (!mergedLogs.some(existing => existing.date === log.date && existing.status === log.status)) mergedLogs.push(log);
                    });
                    return createAttendanceMetrics(sessionMetrics.attendanceCount,
                        Math.max(sessionMetrics.absentCount, mergedLogs.filter(log => log.status === 'غائب').length),
                        Math.max(sessionMetrics.excusedCount, mergedLogs.filter(log => log.status === 'مجاز').length),
                        mergedLogs, { hasSessionRecords: sessionMetrics.hasSessionRecords, hasApplicableSessions: true });
                }
                if ((appState.savedSessions || []).length === 0) return legacy;
                return createAttendanceMetrics(0, legacy.absentCount, legacy.excusedCount, legacy.attendanceLogs, {});
            }

            if (!sessionMetrics.hasApplicableSessions && !sessionMetrics.hasSessionRecords) return legacy;
            const mergedLogs = [...sessionMetrics.attendanceLogs];
            legacy.attendanceLogs.forEach(log => {
                if (!mergedLogs.some(existing => existing.date === log.date && existing.status === log.status)) mergedLogs.push(log);
            });
            return createAttendanceMetrics(
                Math.max(legacy.attendanceCount, sessionMetrics.attendanceCount),
                Math.max(legacy.absentCount, sessionMetrics.absentCount, mergedLogs.filter(log => log.status === 'غائب').length),
                Math.max(legacy.excusedCount, sessionMetrics.excusedCount, mergedLogs.filter(log => log.status === 'مجاز').length),
                mergedLogs,
                { hasSessionRecords: sessionMetrics.hasSessionRecords, hasApplicableSessions: sessionMetrics.hasApplicableSessions }
            );
        }

                const [cName, sSec, sStudy] = classFilterVal.split(' - ');
                filtered = filtered.filter(s => 
                    s.class.trim() === cName.trim() && 
                    s.section.trim() === sSec.trim() && 
                    (s.studyType || 'صباحي').trim() === sStudy.trim()
                );
            }

            if (searchKey) {
                filtered = filtered.filter(s => s.name.toLowerCase().includes(searchKey));
            }

            filtered = filterStudentsForAttendanceSubject(filtered, getSelectedReportSubject(), classFilterVal);

            filtered = sortStudentsAlphabetically(filtered);

            let rows = filtered.map((s, i) => {
                const pickedSubject = getSelectedReportSubject();
                const metrics = getStudentAbsenceMetrics(s, pickedSubject, classFilterVal);
                let absenceDates = (metrics.absenceDates || [])
                    .map(date => date)
                    .join(' ، ');

                    absenceDates = '<span class="text-emerald-700 font-bold">لا يوجد غياب (ملتزم)</span>';
                } else if (!absenceDates && (metrics.absentCount || 0) > 0) {

                return `
                    <tr class="border-b border-slate-100 text-[11px]">
                        <td class="p-2 text-center font-bold">${i+1}</td>
                        <td class="p-2 font-bold text-slate-800 whitespace-nowrap">${escapeHtml(s.name)}</td>

                    </tr>

        function saveUpdatedClassItem(classId) {
            let cls = appState.classes.find(c => c.id === classId);
            if (!cls) return;

            let newName = document.getElementById('edit-cls-name').value.trim();
            let newSec = document.getElementById('edit-cls-section').value.trim();
            let newStudy = document.getElementById('edit-cls-study').value || 'صباحي';
            let subjectNames = document.getElementById('edit-cls-subjects') ? document.getElementById('edit-cls-subjects').value : '';

            if (!newName || !newSec) {
                showToast("الرجاء ملء اسم الصف والشعبة", "error");
                return;
            }
            const duplicate = appState.classes.some(other => other.id !== classId &&
                normalizeAcademicText(other.name) === normalizeAcademicText(newName) &&
                normalizeAcademicText(other.section) === normalizeAcademicText(newSec) &&
                normalizeAcademicText(other.studyType || 'صباحي') === normalizeAcademicText(newStudy));
            if (duplicate) {
                showToast("هذه الصف والشعبة ونوع الدراسة مسجلة مسبقاً", "error");
                return;
            }

            const oldIdentity = { name: cls.name, section: cls.section, studyType: cls.studyType || 'صباحي' };
            const isOldIdentity = item => normalizeAcademicText(item.class) === normalizeAcademicText(oldIdentity.name) &&
                normalizeAcademicText(item.section) === normalizeAcademicText(oldIdentity.section) &&
                normalizeAcademicText(item.studyType || 'صباحي') === normalizeAcademicText(oldIdentity.studyType);

            cls.name = newName;
            cls.section = newSec;
            cls.studyType = newStudy;

            appState.students.forEach(student => {
                if (normalizeAcademicText(student.class) === normalizeAcademicText(oldIdentity.name) &&
                    normalizeAcademicText(student.section) === normalizeAcademicText(oldIdentity.section) &&
                    normalizeAcademicText(student.studyType || 'صباحي') === normalizeAcademicText(oldIdentity.studyType)) {
                    student.class = newName;
                    student.section = newSec;
                    student.studyType = newStudy;
                }
            });

            appState.subjects.forEach(subject => {
                if (isOldIdentity(subject)) {
                    subject.class = newName;
                    subject.section = newSec;
                    subject.studyType = newStudy;
                }
            });

            appState.savedSessions.forEach(session => {
                if (normalizeAcademicText(session.className) === normalizeAcademicText(oldIdentity.name) &&
                    normalizeAcademicText(session.section) === normalizeAcademicText(oldIdentity.section) &&
                    normalizeAcademicText(session.studyType || 'صباحي') === normalizeAcademicText(oldIdentity.studyType)) {
                    session.className = newName;
                    session.section = newSec;
                    session.studyType = newStudy;
                }
            });

            const oldScheduleName = `${oldIdentity.name} (${oldIdentity.section} - ${oldIdentity.studyType})`;
            const newScheduleName = `${newName} (${newSec} - ${newStudy})`;
            appState.schedule.forEach(item => {
                if (String(item.className || '').trim() === oldScheduleName) item.className = newScheduleName;
            });

            applyClassSubjectNames(cls, subjectNames);
            persistLocalState();
            showToast("تم تعديل الصف والشعبة والدراسة والمواد المرتبطة بها بنجاح!");
            triggerAction('add_class');
            updateStatsBar();
            renderContent();
        }

        function deleteClassItem(classId) {
            if (!confirm("هل أنت متأكد من رغبتك في حذف هذه الصف والشعبة؟")) return;
            const deletedClass = appState.classes.find(c => c.id === classId);
            if (deletedClass) {
                appState.subjects = appState.subjects.filter(subject =>
                    !(normalizeAcademicText(subject.class) === normalizeAcademicText(deletedClass.name) &&
                      normalizeAcademicText(subject.section) === normalizeAcademicText(deletedClass.section) &&
                      normalizeAcademicText(subject.studyType || 'صباحي') === normalizeAcademicText(deletedClass.studyType || 'صباحي'))
                );
                const deletedScheduleName = `${deletedClass.name} (${deletedClass.section} - ${deletedClass.studyType || 'صباحي'})`;
                appState.schedule = appState.schedule.filter(item => String(item.className || '').trim() !== deletedScheduleName);
            }
            appState.classes = appState.classes.filter(c => c.id !== classId);
            persistLocalState();
            showToast("تم حذف الصف والشعبة والمواد المرتبطة بها بنجاح!");

            updateStatsBar();
            renderContent();

        function openStudentWhatsApp(phone) {
            let digits = String(phone || '').replace(/\D/g, '');
            if (digits.startsWith('00')) digits = digits.slice(2);
            if (digits.startsWith('0')) digits = '964' + digits.slice(1);
            else if (digits.startsWith('7')) digits = '964' + digits;
            if (!digits) { showToast('رقم واتساب غير صالح', 'error'); return; }
            window.open(`https://wa.me/${digits}`, '_blank', 'noopener,noreferrer');
        }

        function normalizeStudentSearchText(value) {
            return String(value || '')
                .toLocaleLowerCase('ar')
                .normalize('NFD')
                .replace(/[\u064B-\u065F\u0670]/g, '')
                .replace(/[أإآٱ]/g, 'ا')
                .replace(/ى/g, 'ي')
                .replace(/ة/g, 'ه')
                .trim();
        }

        function filterRegisteredStudentsList() {
            const searchInput = document.getElementById('registered-students-search');
            const list = document.getElementById('registered-students-list');
            if (!searchInput || !list) return;

            const query = normalizeStudentSearchText(searchInput.value);
            const cards = Array.from(list.querySelectorAll('.registered-student-card'));
            let visibleCount = 0;

            cards.forEach((card, index) => {
                const name = normalizeStudentSearchText(card.dataset.studentName || card.querySelector('h5')?.textContent || '');
                const matches = !query || name.includes(query);
                card.classList.toggle('hidden', !matches);
                if (matches) {
                    visibleCount++;
                    const rowNumber = card.querySelector('.registered-student-index');
                    if (rowNumber) rowNumber.textContent = String(visibleCount);
                }
            });

            const count = document.getElementById('registered-students-count');
            if (count) count.textContent = query
                ? `نتائج البحث: ${visibleCount} من ${cards.length}`
                : `عدد الطلبة: ${cards.length}`;

            const empty = document.getElementById('registered-students-empty');
            if (empty) {
                empty.classList.toggle('hidden', visibleCount > 0);
                empty.textContent = cards.length === 0
                    ? 'لا يوجد طلبة مسجلين حالياً'
                    : 'لا توجد أسماء مطابقة للبحث';
            }
        }

        function saveUpdatedSubjectItem(subjectId) {
            const sub = (appState.subjectCatalog || []).find(item => String(item.id) === String(subjectId));
            if (!sub) return;
            const input = document.getElementById('edit-sub-name');
            const newName = String(input && input.value || '').trim();
            const oldName = String(sub.name || '').trim();
            if (!newName) { showToast('الرجاء إدخال اسم المادة', 'error'); return; }
            if ((appState.subjectCatalog || []).some(item => String(item.id) !== String(subjectId) && normalizeAcademicText(item.name) === normalizeAcademicText(newName))) {
                showToast('توجد مادة أخرى بهذا الاسم؛ اختر اسماً مختلفاً', 'error'); return;
            }

            const oldKey = normalizeAcademicText(oldName);
            sub.name = newName;
            (appState.subjects || []).forEach(item => { if (normalizeAcademicText(item.name) === oldKey) item.name = newName; });
            (appState.students || []).forEach(student => {
                if (normalizeAcademicText(student.subject) === oldKey) student.subject = newName;
                (Array.isArray(student.behaviorLog) ? student.behaviorLog : []).forEach(log => {
                    if (log && normalizeAcademicText(log.subject) === oldKey) log.subject = newName;
                });
            });
            (appState.savedSessions || []).forEach(session => { if (session && normalizeAcademicText(session.subject) === oldKey) session.subject = newName; });
            (appState.schedule || []).forEach(item => { if (item && normalizeAcademicText(item.subject) === oldKey) item.subject = newName; });
            if (appState.schoolInfo && normalizeAcademicText(appState.schoolInfo.subject) === oldKey) appState.schoolInfo.subject = newName;

            // عند تغيير الاسم إلى اسم مستخدم سابقاً في نفس الشعبة، ادمج الربط المكرر.
            const assignments = new Map();
            (appState.subjects || []).forEach(item => {
                const key = getSubjectAssignmentKey(item.name, item.class, item.section, item.studyType || 'صباحي');
                if (!assignments.has(key)) assignments.set(key, item);
            });
            appState.subjects = Array.from(assignments.values());
            persistLocalState();
            showToast('تم تعديل اسم المادة وتحديث ارتباطاتها بنجاح');
            updateStatsBar();
            triggerAction('add_subject');
            renderContent();
        }

        function handleLogoUpload(event) {
            const file = event && event.target && event.target.files ? event.target.files[0] : null;
            if (!file) return;
            if (!String(file.type || '').startsWith('image/')) {
                showToast('يرجى اختيار ملف صورة صالح للشعار', 'error');
                event.target.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onerror = function() { showToast('تعذرت قراءة صورة الشعار', 'error'); };
            reader.onload = function(e) {
                const img = new Image();
                img.onerror = function() { showToast('تعذر فتح الصورة المختارة', 'error'); };
                img.onload = function() {
                    // احتفظ بدقة مناسبة للشعارات بدلاً من تصغيرها إلى 120px، مع حفظ نسبة الأبعاد.
                    const maxDim = 1200;
                    const ratio = Math.min(1, maxDim / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
                    const width = Math.max(1, Math.round((img.naturalWidth || img.width) * ratio));
                    const height = Math.max(1, Math.round((img.naturalHeight || img.height) * ratio));
                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d', { alpha: true });
                    if (!ctx) { showToast('تعذر معالجة صورة الشعار', 'error'); return; }
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.clearRect(0, 0, width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    const isJpeg = /image\/(jpeg|jpg)/i.test(file.type);
                    const optimizedLogo = canvas.toDataURL(isJpeg ? 'image/jpeg' : 'image/png', 0.94);
                    appState.schoolInfo.logo = optimizedLogo;
                    const box = document.getElementById('logo-preview-box');
                    if (box) box.innerHTML = `<img src="${optimizedLogo}" class="w-full h-full object-contain" alt="شعار المدرسة">`;
                    updateStatsBar();
                    persistLocalState();
                    showToast('تم حفظ الشعار بجودة مرتفعة');
                };
                img.src = String(e.target.result || '');
            };
            reader.readAsDataURL(file);
        }

        function randomStudentLoginCode() {
            // الرمز يتكون من حرفين لاتينيين ورقمين، بترتيب مختلط.
            const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
            const digits = '0123456789';
            const chars = [
                letters[Math.floor(Math.random() * letters.length)],
                letters[Math.floor(Math.random() * letters.length)],
                digits[Math.floor(Math.random() * digits.length)],
                digits[Math.floor(Math.random() * digits.length)]
            ];
            for (let i = chars.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [chars[i], chars[j]] = [chars[j], chars[i]];
            }
            return chars.join('');
        }
        function createUniqueStudentCode(exceptId = null) {
            let code = randomStudentLoginCode(), attempts = 0;
            while (appState.students.some(st => String(st.id) !== String(exceptId) && String(st.loginCode || '').toUpperCase() === code) && attempts++ < 1000) code = randomStudentLoginCode();
            return code;
        }
        function ensureStudentLoginCodes() {
            if (!appState || !Array.isArray(appState.students)) return;
            const seen = new Set();
            const validCode = code => /^(?=(?:.*[A-Z]){2})(?=(?:.*[0-9]){2})[A-Z0-9]{4}$/.test(code);
            appState.students.forEach(st => {
                const code = String(st.loginCode || '').trim().toUpperCase();
                if (!validCode(code) || seen.has(code)) st.loginCode = createUniqueStudentCode(st.id);
                else st.loginCode = code;
                seen.add(st.loginCode);
            });
        }
        function cleanupExpiredStudentMessages() {
            if (!Array.isArray(appState.studentMessages)) appState.studentMessages = [];
            const cutoff = Date.now() - 3 * 24 * 60 * 60 * 1000;
            appState.studentMessages = appState.studentMessages.filter(msg => {
                const stamp = Date.parse(msg.updatedAt || msg.createdAt || '') || 0;
                return stamp >= cutoff;
            });
        }
        function copyTextSafe(value) {
            const txt = String(value || '');
            if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => showToast('تم نسخ الرمز')).catch(() => fallbackCopyText(txt));
            else fallbackCopyText(txt);
        }
        function fallbackCopyText(value) {
            const input = document.createElement('textarea'); input.value = value; input.style.position='fixed'; input.style.opacity='0'; document.body.appendChild(input); input.select();
            try { document.execCommand('copy'); showToast('تم نسخ الرمز'); } catch(e) { showToast('تعذر النسخ التلقائي؛ انسخ الرمز يدوياً', 'error'); }
            input.remove();
        }

jection('${String(o.id).replace(/'/g,'')}')" class="rounded-xl bg-rose-50 text-rose-700 border border-rose-100 py-2 text-[10px] font-black">حذف الاعتراض</button></div></div>`).join(''):'<div class="text-xs text-center text-slate-400 bg-white rounded-2xl p-4 border">لا توجد اعتراضات مرسلة</div>'}</div>`;

جهة الطالب</button>`}</article>`;

                body.innerHTML = composer + nav + statusNav + recordsHtml;
                updateTeacherMessageStudentOptions();
            } else {
                body.innerHTML = nav + statusNav + (filtered.length ? filtered.map(o => {

                    const answered = isAnswered(o);
                    const safeId = String(o.id).replace(/[^\w-]/g, '_');
                    return `<article class="border border-slate-200 rounded-2xl p-3 mb-2 bg-white"><div class="flex justify-between gap-2"><div><b class="text-xs">${escapeHtml(student?.name || o.studentName || 'طالب')} · ${escapeHtml(o.gradeKey || 'درجة')}</b><p class="text-[9px] text-slate-400 mt-1">${escapeHtml(student ? `${student.class} · شعبة ${student.section}` : '')}</p></div><span class="text-[9px] font-black rounded-full px-2 py-1 ${answered?'bg-emerald-50 text-emerald-700':'bg-amber-50 text-amber-700'}">${answered?'تم الرد عليها':'لم يرد عليها'}</span></div><p class="text-xs whitespace-pre-wrap mt-2">${escapeHtml(o.message || '')}</p>${o.reply?`<div class="mt-2 p-2 rounded-xl bg-emerald-50 text-xs"><b class="text-emerald-700">الرد السابق</b><p class="mt-1 whitespace-pre-wrap">${escapeHtml(o.reply)}</p></div>`:''}<textarea id="objection-reply-${safeId}" rows="2" placeholder="اكتب إجابة الاعتراض..." class="w-full mt-2 p-2 rounded-xl bg-slate-50 border text-xs">${escapeHtml(o.reply || '')}</textarea><button onclick="answerGradeObjection('${String(o.id).replace(/'/g,'')}')" class="w-full bg-slate-900 text-amber-400 py-2 rounded-xl mt-1 text-xs font-black">حفظ الرد في واجهة الطالب</button></article>`;

        function updateTeacherMessageStudentOptions() {
            const select = document.getElementById('teacher-message-student');
            if (!select) return;
            const classValue = document.getElementById('teacher-message-class')?.value || 'all';
            const query = String(document.getElementById('teacher-message-student-search')?.value || '').trim().toLocaleLowerCase('ar');
            const cls = parseClassSelection(classValue);
            const students = sortStudentsAlphabetically((appState.students || []).filter(st => {
                const classMatch = classValue === 'all' || (normalizeAcademicText(st.class) === normalizeAcademicText(cls.name) && normalizeAcademicText(st.section) === normalizeAcademicText(cls.section) && normalizeAcademicText(st.studyType || 'صباحي') === normalizeAcademicText(cls.studyType || 'صباحي'));
                return classMatch && (!query || String(st.name || '').toLocaleLowerCase('ar').includes(query));
            }));
            const previous = select.value;
            select.innerHTML = `<option value="">اختر الطالب</option>` + students.map(st => `<option value="${escapeHtml(st.id)}">${escapeHtml(st.name)} · ${escapeHtml(st.class)} (${escapeHtml(st.section)})</option>`).join('');
            if (students.some(st => String(st.id) === String(previous))) select.value = previous;
        }

        function sendTeacherMessageToStudent() {
            const studentId = document.getElementById('teacher-message-student')?.value;
            const student = (appState.students || []).find(st => String(st.id) === String(studentId));
            const textValue = String(document.getElementById('teacher-message-text')?.value || '').trim();
            if (!student) { showToast('اختر الطالب المستلم أولاً', 'error'); return; }
            if (!textValue) { showToast('اكتب نص الرسالة أولاً', 'error'); return; }
            const now = new Date().toISOString();
            appState.studentMessages = Array.isArray(appState.studentMessages) ? appState.studentMessages : [];
            appState.studentMessages.push({ id: Date.now() + Math.random(), studentId: student.id, studentName: student.name, class: student.class, section: student.section, studyType: student.studyType || 'صباحي', direction: 'teacher_to_student', text: textValue, createdAt: now, updatedAt: now, status: 'pending', studentReply: '', replies: [] });
            persistLocalState();
            renderTeacherStudentAdminTab('messages');
            showToast('تم إرسال الرسالة إلى واجهة الطالب');
        }

            renderTeacherStudentAdminTab(tab);

            const text = updated.trim();
            if (!text) { showToast('لا يمكن حفظ رسالة فارغة', 'error'); return; }
            message.text = text;
            message.updatedAt = new Date().toISOString();
            persistLocalState();
            renderTeacherStudentAdminTab('messages');
            showToast('تم تعديل الرسالة وتحديثها في واجهة الطالب');
        }

        function replyStudentMessage(messageId) {
            const msg = (appState.studentMessages || []).find(m => String(m.id) === String(messageId));
            if (!msg || msg.direction === 'teacher_to_student') return;
            const input = document.getElementById('teacher-reply-' + String(messageId).replace(/[^\w-]/g, '_')) || document.getElementById('teacher-reply-' + messageId);
            const value = String(input?.value || '').trim();
            if (!value) { showToast('اكتب الرد أولاً', 'error'); return; }
            if (!Array.isArray(msg.replies)) msg.replies = [];
            msg.replies.push({ text: value, date: new Date().toLocaleString('ar-IQ'), createdAt: new Date().toISOString() });
            msg.status = 'answered';
            msg.updatedAt = new Date().toISOString();
            delete msg._replyBoxOpen;
            persistLocalState(); cleanupExpiredStudentMessages(); renderTeacherStudentAdminTab('messages');
            showToast('تم إرسال الرد وتحديث واجهة الطالب');
        }

            showToast('تم حفظ الرد على الاعتراض في واجهة الطالب');
        }

                        <div class="flex items-center gap-3"><div class="w-11 h-11 rounded-2xl bg-amber-400/15 text-amber-300 flex items-center justify-center text-xl"><i class="fa-solid fa-hand-paper"></i></div><div><h3 class="font-black text-sm">المشاركة الصفية</h3><p class="text-[10px] text-slate-300 mt-1">اختر الطالب لتسجيل مشاركته وتقييمه وملاحظاتك حسب التاريخ والموضوع</p></div></div>

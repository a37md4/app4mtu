        /* Official Professional Printable Sheet Styling */
        @media print {
            html, body {
                background: white !important; 
                color: black !important;
                padding: 0 !important;
                margin: 0 !important;
                height: auto !important;
                min-height: auto !important;
                display: block !important;
            }

            #app-content, 
            .bottom-dock, 
            .no-print, 
            #toast,

            }

            #action-modal {
                position: static !important;
                background: transparent !important;
                padding: 0 !important;
                margin: 0 !important;
                opacity: 1 !important;

        /* Modern participation cards and selectable choices */
        .participation-student-card {
            position: relative;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            border-radius: 22px;
            background: linear-gradient(145deg, #ffffff 0%, #fbfdff 100%);
            padding: 13px;
            box-shadow: 0 5px 16px rgba(15, 23, 42, .045);
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
        }
        .participation-student-card:hover {
            transform: translateY(-1px);
            border-color: #c7d2fe;
            box-shadow: 0 10px 24px rgba(30, 41, 59, .08);
        }
        .participation-student-card::before {
            content: "";
            position: absolute;
            top: 0; right: 0; left: 0; height: 3px;
            background: linear-gradient(90deg, #6366f1, #38bdf8, #fbbf24);
            opacity: .9;
        }
        .part-student-avatar {
            width: 46px; height: 46px; flex: 0 0 46px;
            border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #4338ca; background: linear-gradient(145deg, #eef2ff, #e0e7ff);
            border: 1px solid #c7d2fe;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
        }
        .part-student-avatar .part-student-index { font-size: 10px; line-height: 1; font-weight: 900; }
        .part-student-avatar i { font-size: 13px; margin-top: 4px; }
        .part-meta-chip {
            display: inline-flex; align-items: center; gap: 5px;
            border: 1px solid #e2e8f0; border-radius: 999px;
            background: #f8fafc; color: #64748b;
            padding: 4px 8px; font-size: 9px; font-weight: 800;
        }
        .part-status-pill, .part-evaluation-pill {
            display: inline-flex; align-items: center; justify-content: center; gap: 5px;
            border-radius: 999px; border: 1px solid transparent;
            padding: 5px 9px; font-size: 9px; font-weight: 900; white-space: nowrap;
        }
        .participation-pill-positive { background: #ecfdf5; border-color: #a7f3d0; color: #047857; }
        .participation-pill-negative { background: #fff1f2; border-color: #fecdd3; color: #be123c; }
        .participation-pill-neutral { background: #f1f5f9; border-color: #e2e8f0; color: #64748b; }
        .participation-eval-excellent { background: #fffbeb; border-color: #fde68a; color: #b45309; }
        .participation-eval-medium { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
        .participation-eval-poor { background: #fff1f2; border-color: #fecdd3; color: #be123c; }
        .participation-detail-tile {
            display: flex; align-items: center; justify-content: space-between; gap: 6px;
            min-width: 0; border-radius: 13px; background: #f8fafc;
            border: 1px solid #eef2f7; padding: 8px 10px;
        }
        .participation-detail-tile > span { color: #94a3b8; font-size: 9px; font-weight: 800; }
        .participation-detail-tile > b { color: #334155; font-size: 10px; font-weight: 900; overflow-wrap: anywhere; }
        .part-choice-option {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            min-height: 47px; padding: 10px 9px; border-radius: 15px;
            border: 1.5px solid #e2e8f0; color: #475569;
            background: linear-gradient(145deg, #ffffff, #f8fafc);
            font-family: inherit; font-size: 11px; font-weight: 900;
            box-shadow: 0 2px 5px rgba(15,23,42,.025);
            transition: all .16s ease; cursor: pointer;
        }
        .part-choice-option:hover { border-color: #a5b4fc; background: #f5f7ff; }
        .part-choice-option .part-choice-check { display: none; margin-right: auto; font-size: 10px; }
        .part-choice-option.is-selected { box-shadow: 0 0 0 2px rgba(99,102,241,.08); transform: translateY(-1px); }
        .part-choice-option.is-selected .part-choice-check { display: inline-block; }
        .part-choice-option.is-selected[data-part-choice="status"][data-part-value="مشارك"] { color: #047857; background: #ecfdf5; border-color: #10b981; }
        .part-choice-option.is-selected[data-part-choice="status"][data-part-value="غير مشاركة"] { color: #be123c; background: #fff1f2; border-color: #fb7185; }
        .part-choice-option.is-selected[data-part-choice="evaluation"][data-part-value="ممتاز"] { color: #b45309; background: #fffbeb; border-color: #fbbf24; }
        .part-choice-option.is-selected[data-part-choice="evaluation"][data-part-value="وسط"] { color: #1d4ed8; background: #eff6ff; border-color: #60a5fa; }
        .part-choice-option.is-selected[data-part-choice="evaluation"][data-part-value="سيء"] { color: #be123c; background: #fff1f2; border-color: #fb7185; }
        .part-choice-option.is-selected[data-part-choice="evaluation"][data-part-value=""] { color: #475569; background: #f1f5f9; border-color: #94a3b8; }
        .part-section-label { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; color: #334155; font-size: 10px; font-weight: 900; }
        .part-section-label i { width: 23px; height: 23px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; background: #eef2ff; color: #4f46e5; }
        @media (prefers-reduced-motion: reduce) {
            .participation-student-card, .part-choice-option { transition: none; }

</style>

                    const key = getSubjectAssignmentKey(linked.name, linked.class, linked.section, linked.studyType);

            const shouldMigrateLegacySubjectLinks = Number(appState.subjectAssignmentSchemaVersion || 0) < 2;
            const ensureSubjectAssignment = (subjectName, className, section, studyType) => {
                const cleanName = String(subjectName || '').trim();

        function normalizeAcademicText(value) {
            return String(value == null ? '' : value).normalize('NFKC').trim().toLocaleLowerCase('ar');
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[character]);
        }

        function getSubjectAssignmentKey(subjectName, className, section, studyType) {
            return [subjectName, className, section, studyType || 'صباحي'].map(normalizeAcademicText).join('||');
        }

        function parseClassSelection(value) {
            const parts = String(value || '').split(' - ');
            return {
                name: (parts[0] || '').trim(),
                section: (parts[1] || '').trim(),
                studyType: (parts.slice(2).join(' - ') || 'صباحي').trim()
            };
        }

        function getClassSubjectNames(classRecord) {
            if (!classRecord) return [];
            const seen = new Set();
            return appState.subjects
                .filter(subject => normalizeAcademicText(subject.class) === normalizeAcademicText(classRecord.name) &&
                    normalizeAcademicText(subject.section) === normalizeAcademicText(classRecord.section) &&
                    normalizeAcademicText(subject.studyType || 'صباحي') === normalizeAcademicText(classRecord.studyType || 'صباحي'))
                .map(subject => String(subject.name || '').trim())
                .filter(name => {
                    const key = normalizeAcademicText(name);
                    if (!name || seen.has(key)) return false;
                    seen.add(key);
                    return true;
                })
                .sort((a, b) => a.localeCompare(b, 'ar'));
        }

        function getAllRegisteredSubjectNames() {
            const names = new Map();
            (appState.subjectCatalog || []).forEach(item => {
                const name = String(item && item.name || '').trim();
                const key = normalizeAcademicText(name);
                if (name && !names.has(key)) names.set(key, name);
            });
            // Fallback for imported/older records until normalizeAppState runs.
            (appState.subjects || []).forEach(item => {
                const name = String(item && item.name || '').trim();
                const key = normalizeAcademicText(name);
                if (name && !names.has(key)) names.set(key, name);
            });
            return [...names.values()].sort((a, b) => a.localeCompare(b, 'ar'));
        }

        function getSubjectNamesForClassSelection(classValue) {
            if (!classValue || classValue === 'all') return getAllRegisteredSubjectNames();
            const parts = parseClassSelection(classValue);
            const classRecord = appState.classes.find(cls =>
                normalizeAcademicText(cls.name) === normalizeAcademicText(parts.name) &&
                normalizeAcademicText(cls.section) === normalizeAcademicText(parts.section) &&
                normalizeAcademicText(cls.studyType || 'صباحي') === normalizeAcademicText(parts.studyType || 'صباحي')
            );
            return classRecord ? getClassSubjectNames(classRecord) : [];
        }

        function getSubjectOptionsHtmlForClass(classValue, selectedSubject = '') {
            const names = getSubjectNamesForClassSelection(classValue);
            if (!names.length) return '<option value="">لا توجد مواد مرتبطة بهذه الشعبة</option>';
            const hasSelected = names.some(name => normalizeAcademicText(name) === normalizeAcademicText(selectedSubject));
            return names.map((name, index) => `<option value="${escapeHtml(name)}" ${(hasSelected ? normalizeAcademicText(name) === normalizeAcademicText(selectedSubject) : index === 0) ? 'selected' : ''}>${escapeHtml(name)}</option>`).join('');
        }

        function applyClassSubjectNames(classRecord, rawNames) {
            if (!classRecord) return;
            const catalogNames = new Map((appState.subjectCatalog || []).map(item => [normalizeAcademicText(item.name), String(item.name || '').trim()]));
            const rawRequested = String(rawNames || '').split(/[,،;؛\n\r]+/).map(name => name.trim()).filter(Boolean);
            const requestedNames = [];
            const seenNames = new Set();
            const unknownNames = [];
            rawRequested.forEach(name => {
                const key = normalizeAcademicText(name);
                const canonical = catalogNames.get(key);
                if (!canonical) { unknownNames.push(name); return; }
                if (!seenNames.has(key)) {
                    seenNames.add(key);
                    requestedNames.push(canonical);
                }
            });

            const identityMatches = subject =>
                normalizeAcademicText(subject.class) === normalizeAcademicText(classRecord.name) &&
                normalizeAcademicText(subject.section) === normalizeAcademicText(classRecord.section) &&
                normalizeAcademicText(subject.studyType || 'صباحي') === normalizeAcademicText(classRecord.studyType || 'صباحي');

            appState.subjects = appState.subjects.filter(subject => !identityMatches(subject) || seenNames.has(normalizeAcademicText(subject.name)));
            requestedNames.forEach(name => {
                const exists = appState.subjects.some(subject => identityMatches(subject) && normalizeAcademicText(subject.name) === normalizeAcademicText(name));
                if (!exists) appState.subjects.push({
                    id: Date.now() + Math.random(),
                    name,
                    class: classRecord.name,
                    section: String(classRecord.section || '').trim(),
                    studyType: String(classRecord.studyType || 'صباحي').trim(),
                    teacher: (appState.subjectCatalog.find(item => normalizeAcademicText(item.name) === normalizeAcademicText(name)) || {}).teacher || (appState.schoolInfo && appState.schoolInfo.teacher) || ''
                });
            });
            if (unknownNames.length) showToast('تم تجاهل مواد غير مسجلة في تبويب إضافة مادة دراسية: ' + unknownNames.slice(0, 2).join('، '), 'error');
        }

            const currentNames = String(input.value || '').split(/[,،;؛\n\r]+/).map(name => name.trim()).filter(Boolean);
            if (!currentNames.some(name => normalizeAcademicText(name) === normalizeAcademicText(pickedName))) {
                input.value = currentNames.length ? currentNames.join('، ') + '، ' + pickedName : pickedName;
            }
            picker.value = '';

        function downloadLocalBackupJSON() {
            const safeState = JSON.parse(JSON.stringify(appState));
            const blob = new Blob([JSON.stringify(safeState, null, 2)], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = `school_backup_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast('تم تنزيل ملف النسخة الاحتياطية');
        }

        function restoreLocalBackup(input) {
            const file = input && input.files && input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function() {
                try {
                    const restored = JSON.parse(String(reader.result || ''));
                    if (!restored || typeof restored !== 'object' || !Array.isArray(restored.students) || !Array.isArray(restored.classes)) {
                        throw new Error('ملف النسخة الاحتياطية غير صالح');
                    }
                    if (!confirm('سيتم استبدال البيانات الحالية بالبيانات الموجودة في النسخة الاحتياطية. هل تريد المتابعة؟')) {
                        input.value = '';
                        return;
                    }
                    appState = restored;
                                    normalizeAppState();
                    persistLocalState();
                    updateStatsBar();
                    renderContent();
                    closeModal();
                    showToast('تم استرجاع النسخة الاحتياطية بنجاح');
                } catch (error) {
                    console.error(error);
                    showToast('تعذر استرجاع النسخة؛ تحقق من صحة ملف JSON', 'error');
                } finally {
                    input.value = '';
                }
            };
            reader.onerror = function() { showToast('تعذر قراءة ملف النسخة الاحتياطية', 'error'); input.value = ''; };
            reader.readAsText(file, 'utf-8');
        }

            container.innerHTML = `<div class="space-y-3"><div class="grid grid-cols-3 gap-1.5">${tabs.map(([key,label,icon]) => `<button onclick="switchBehaviorSubTab('${key}')" class="rounded-xl border py-2.5 px-1 text-[10px] font-black ${activeBehaviorSubTab===key?'bg-slate-900 text-amber-400 border-slate-900':'bg-white text-slate-600 border-slate-200'}"><i class="fa-solid ${icon} block text-sm mb-1"></i>${label}</button>`).join('')}</div><div id="behavior-subtab-body"></div></div>`;
            renderBehaviorSubTab();
        }

        function switchBehaviorSubTab(tab) {
            activeBehaviorSubTab = ['notes','homework'].includes(tab) ? tab : 'behavior';
            renderBehaviorTab(document.getElementById('app-content'));
        }

        function renderBehaviorSubTab() {
            const body = document.getElementById('behavior-subtab-body');
            if (!body) return;
            if (activeBehaviorSubTab === 'behavior') {
                renderBehaviorMarksTab(body);
                return;
            }
            renderTeacherStudentRecordForm(body, activeBehaviorSubTab);
        }

        function getBehaviorRecordClassOptions() {
            return `<option value="all">جميع الصفوف والشعب</option>` + (appState.classes || []).map(c => {
                const value = `${c.name} - ${c.section} - ${c.studyType || 'صباحي'}`;
                return `<option value="${escapeHtml(value)}">${escapeHtml(c.name)} (شعبة ${escapeHtml(c.section)} - ${escapeHtml(c.studyType || 'صباحي')})</option>`;
            }).join('');
        }

        function getBehaviorRecordFilteredStudents() {
            const classValue = document.getElementById('record-class-select')?.value || 'all';
            const query = String(document.getElementById('record-student-search')?.value || '').trim().toLocaleLowerCase('ar');
            const cls = parseClassSelection(classValue);
            return sortStudentsAlphabetically((appState.students || []).filter(st => {
                const classMatch = classValue === 'all' || (normalizeAcademicText(st.class) === normalizeAcademicText(cls.name) && normalizeAcademicText(st.section) === normalizeAcademicText(cls.section) && normalizeAcademicText(st.studyType || 'صباحي') === normalizeAcademicText(cls.studyType || 'صباحي'));
                const nameMatch = !query || String(st.name || '').toLocaleLowerCase('ar').includes(query);
                return classMatch && nameMatch;
            }));
        }

        function updateBehaviorRecordStudentOptions() {
            const select = document.getElementById('record-student-select');
            if (!select) return;
            const previous = select.value;
            const students = getBehaviorRecordFilteredStudents();
            select.innerHTML = `<option value="">اختر الطالب</option>` + students.map(st => `<option value="${escapeHtml(st.id)}">${escapeHtml(st.name)} · ${escapeHtml(st.class)} (${escapeHtml(st.section)})</option>`).join('');
            if (students.some(st => String(st.id) === String(previous))) select.value = previous;
        }

        function renderTeacherStudentRecordForm(container, kind) {
            const isNote = kind === 'notes';
            const title = isNote ? 'إضافة ملاحظة لطالب' : 'تقييم واجب طالب';
            const icon = isNote ? 'fa-note-sticky' : 'fa-book-open';
            container.innerHTML = `<div class="space-y-3"><div class="bg-white rounded-3xl border border-slate-200 p-3.5 space-y-3"><div class="flex items-center gap-2"><span class="w-9 h-9 rounded-xl ${isNote?'bg-amber-50 text-amber-700':'bg-indigo-50 text-indigo-700'} flex items-center justify-center"><i class="fa-solid ${icon}"></i></span><div><h3 class="font-black text-sm text-slate-800">${title}</h3><p class="text-[10px] text-slate-500">اختر الصف والشعبة ثم ابحث عن اسم الطالب</p></div></div><div><label class="block text-[10px] font-black mb-1">الصف والشعبة</label><select id="record-class-select" onchange="updateBehaviorRecordStudentOptions(); renderStudentRecordHistory('${kind}')" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold">${getBehaviorRecordClassOptions()}</select></div><div><label class="block text-[10px] font-black mb-1">البحث عن اسم الطالب</label><input id="record-student-search" type="search" oninput="updateBehaviorRecordStudentOptions(); renderStudentRecordHistory('${kind}')" placeholder="اكتب اسم الطالب..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold"></div><div><label class="block text-[10px] font-black mb-1">الطالب</label><select id="record-student-select" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold"><option value="">اختر الطالب</option></select></div><div><label class="block text-[10px] font-black mb-1">التاريخ</label><input id="record-date-input" type="date" value="${new Date().toISOString().slice(0,10)}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold"></div>${isNote ? `<div><label class="block text-[10px] font-black mb-1">عنوان الملاحظة (اختياري)</label><input id="record-title-input" type="text" maxlength="120" placeholder="عنوان مختصر للملاحظة" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold"></div><div><label class="block text-[10px] font-black mb-1">نص الملاحظة</label><textarea id="record-text-input" rows="4" maxlength="3000" placeholder="اكتب الملاحظة التي ستظهر للطالب..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-bold"></textarea></div>` : `<div><label class="block text-[10px] font-black mb-1">عنوان الواجب</label><input id="record-title-input" type="text" maxlength="160" placeholder="مثال: حل تمارين الفصل الثاني" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold"></div><div><label class="block text-[10px] font-black mb-1">تقييم الواجب</label><select id="record-evaluation-input" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold"><option value="ممتاز">ممتاز</option><option value="جيد جداً">جيد جداً</option><option value="جيد">جيد</option><option value="مقبول">مقبول</option><option value="يحتاج إلى متابعة">يحتاج إلى متابعة</option><option value="لم يُسلّم">لم يُسلّم</option></select></div><div><label class="block text-[10px] font-black mb-1">ملاحظات إضافية (اختياري)</label><textarea id="record-text-input" rows="3" maxlength="2000" placeholder="تفاصيل أو ملاحظة عن الواجب..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-bold"></textarea></div>`}<button type="button" onclick="saveStudentRecord('${kind}')" class="w-full rounded-xl py-3 bg-slate-900 text-amber-400 text-xs font-black"><i class="fa-solid fa-floppy-disk ml-1"></i>حفظ ${isNote?'الملاحظة':'تقييم الواجب'}</button></div><div id="student-record-history" class="space-y-2"></div></div>`;
            updateBehaviorRecordStudentOptions();
            renderStudentRecordHistory(kind);
        }

        function saveStudentRecord(kind) {
            const studentId = document.getElementById('record-student-select')?.value;
            const student = (appState.students || []).find(st => String(st.id) === String(studentId));
            const date = document.getElementById('record-date-input')?.value || new Date().toISOString().slice(0,10);
            const title = String(document.getElementById('record-title-input')?.value || '').trim();
            const textValue = String(document.getElementById('record-text-input')?.value || '').trim();
            if (!student) { showToast('اختر طالباً من القائمة أولاً', 'error'); return; }
            if (kind === 'notes' && !textValue) { showToast('اكتب نص الملاحظة أولاً', 'error'); return; }
            if (kind === 'homework' && !title) { showToast('اكتب عنوان الواجب أولاً', 'error'); return; }
            const base = { id: Date.now() + Math.random(), studentId: student.id, studentName: student.name, class: student.class, section: student.section, studyType: student.studyType || 'صباحي', date, title, text: textValue, createdAt: new Date().toISOString() };
            if (kind === 'notes') {
                appState.studentNotes = Array.isArray(appState.studentNotes) ? appState.studentNotes : [];
                appState.studentNotes.push(base);
            } else {
                appState.homeworkRecords = Array.isArray(appState.homeworkRecords) ? appState.homeworkRecords : [];
                base.evaluation = String(document.getElementById('record-evaluation-input')?.value || 'جيد');
                appState.homeworkRecords.push(base);
            }
            persistLocalState();
            showToast(kind === 'notes' ? 'تم حفظ الملاحظة وربطها بواجهة الطالب' : 'تم حفظ تقييم الواجب وربطه بواجهة الطالب');
            const search = document.getElementById('record-student-search')?.value || '';
            const selectedClass = document.getElementById('record-class-select')?.value || 'all';
            renderTeacherStudentRecordForm(document.getElementById('behavior-subtab-body'), kind);
            const searchInput = document.getElementById('record-student-search');
            const classSelect = document.getElementById('record-class-select');
            if (classSelect) classSelect.value = selectedClass;
            if (searchInput) searchInput.value = search;
            updateBehaviorRecordStudentOptions();
            renderStudentRecordHistory(kind);
        }

        function renderStudentRecordHistory(kind) {
            const box = document.getElementById('student-record-history');
            if (!box) return;
            const isNote = kind === 'notes';
            const records = (isNote ? appState.studentNotes : appState.homeworkRecords) || [];
            const selectedClass = document.getElementById('record-class-select')?.value || 'all';
            const cls = parseClassSelection(selectedClass);
            const query = String(document.getElementById('record-student-search')?.value || '').trim().toLocaleLowerCase('ar');
            const filtered = records.filter(record => {
                const st = (appState.students || []).find(x => String(x.id) === String(record.studentId));
                if (!st) return false;
                const classOk = selectedClass === 'all' || (normalizeAcademicText(st.class) === normalizeAcademicText(cls.name) && normalizeAcademicText(st.section) === normalizeAcademicText(cls.section) && normalizeAcademicText(st.studyType || 'صباحي') === normalizeAcademicText(cls.studyType || 'صباحي'));
                return classOk && (!query || String(st.name || '').toLocaleLowerCase('ar').includes(query));
            }).sort((a,b) => String(b.date || '').localeCompare(String(a.date || '')));
            box.innerHTML = `<h4 class="text-xs font-black text-slate-700 px-1">${isNote?'الملاحظات المحفوظة':'تقييمات الواجبات المحفوظة'}</h4>` + (filtered.length ? filtered.map(record => `<article class="bg-white border border-slate-200 rounded-2xl p-3"><div class="flex justify-between gap-2"><b class="text-xs text-slate-800">${escapeHtml(record.studentName || (appState.students.find(x=>String(x.id)===String(record.studentId))||{}).name || 'طالب')}</b><span class="text-[9px] text-slate-400">${escapeHtml(record.date || '')}</span></div><p class="text-[10px] font-bold text-slate-500 mt-1">${escapeHtml(record.class || '')} · شعبة ${escapeHtml(record.section || '')}</p><p class="text-xs mt-2 whitespace-pre-wrap">${escapeHtml(isNote ? record.text : (record.title || 'واجب'))}</p>${isNote ? '' : `<span class="inline-block mt-2 rounded-full bg-indigo-50 text-indigo-700 px-2 py-1 text-[9px] font-black">${escapeHtml(record.evaluation || 'غير مقيم')}</span>${record.text?`<p class="text-[10px] mt-2 whitespace-pre-wrap">${escapeHtml(record.text)}</p>`:''}`}</article>`).join('') : `<div class="bg-white border rounded-2xl text-center text-xs text-slate-400 p-5">لا توجد سجلات ${isNote?'ملاحظات':'واجبات'} مطابقة</div>`);
        }

        function renderBehaviorMarksTab(container) {
            let classOptions = appState.classes.map(c => `
                <option value="${c.name} - ${c.section} - ${c.studyType || 'صباحي'}">${c.name} (شعبة ${c.section} - ${c.studyType || 'صباحي'})</option>
            `).join('');

            let subOpts = getAllRegisteredSubjectNames().map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');

            container.innerHTML = `
                <div class="space-y-3.5">
                    <div class="bg-amber-500/10 border border-amber-500/20 p-3 rounded-2xl flex justify-between items-center">
                        <div class="flex items-center gap-2.5">
                            <i class="fa-solid fa-award text-amber-600 text-lg"></i>
                            <div>
                                <h4 class="font-extrabold text-xs text-slate-800">سجل النشاط والمتابعة المدرسية</h4>
                                <p class="text-[10px] text-slate-500">إضافة علامة للطالب حسب الصف والشعبة ونوع الدراسة</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl p-3.5 shadow-sm border border-slate-200/80 space-y-2.5">
                        <div>
                            <label class="block text-[10px] font-extrabold text-slate-600 mb-1">الصف والشعبة والدراسة:</label>
                            <select id="beh-filter-class" onchange="updateBehaviorSubjectOptions(); renderBehaviorStudentsList()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold text-slate-700 outline-none">
                                <option value="all">جميع الصفوف والشعب</option>
                                ${classOptions}
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[10px] font-extrabold text-slate-600 mb-1">المادة الدراسية:</label>
                                <select id="beh-filter-subject" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold text-slate-700 outline-none">
                                    ${subOpts || '<option>عام</option>'}
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-extrabold text-slate-600 mb-1">التاريخ:</label>
                                <input id="beh-filter-date" type="date" value="${new Date().toISOString().split('T')[0]}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold text-slate-700 outline-none">
                            </div>
                        </div>
                    </div>

                    <div><label class="block text-[10px] font-extrabold text-slate-600 mb-1">بحث عن اسم طالب:</label><input id="beh-student-search" type="search" oninput="renderBehaviorStudentsList()" placeholder="اكتب اسم الطالب..." class="w-full bg-white border border-slate-200 rounded-xl p-2.5 text-xs font-bold"></div><div id="behavior-students-list" class="space-y-2"></div>
                </div>
            `;

            updateBehaviorSubjectOptions();
            renderBehaviorStudentsList();
        }

        function renderBehaviorStudentsList() {
            const classFilterVal = document.getElementById('beh-filter-class') ? document.getElementById('beh-filter-class').value : 'all';
            const container = document.getElementById('behavior-students-list');
            if (!container) return;

            let filtered = [...appState.students];

            if (classFilterVal !== 'all') {
                const [cName, sSec, sStudy] = classFilterVal.split(' - ');
                filtered = filtered.filter(s => 
                    s.class.trim() === cName.trim() && 
                    s.section.trim() === sSec.trim() && 
                    (s.studyType || 'صباحي').trim() === sStudy.trim()
                );
            }

            const behaviorSearch = String(document.getElementById('beh-student-search')?.value || '').trim().toLocaleLowerCase('ar');
            if (behaviorSearch) filtered = filtered.filter(student => String(student.name || '').toLocaleLowerCase('ar').includes(behaviorSearch));
            const chosenBehaviorSubject = document.getElementById('beh-filter-subject') ? document.getElementById('beh-filter-subject').value : '';
            if (chosenBehaviorSubject) filtered = filtered.filter(student => isSubjectAssignedToStudentClass(chosenBehaviorSubject, student));
            filtered = sortStudentsAlphabetically(filtered);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-3xl p-5 text-center border border-slate-200/80">
                        <i class="fa-solid fa-users-slash text-slate-300 text-3xl mb-2"></i>
                        <p class="text-xs text-slate-500 font-bold">لا يوجد طلبة مطابقين للفلاتر المحددة</p>
                    </div>
                `;
                return;
            }

            let html = filtered.map((st, i) => {
                let badgeClass = 'bg-slate-100 text-slate-700';
                if (st.behavior === 'مميز') badgeClass = 'bg-emerald-50 text-emerald-700 border border-emerald-200';
                else if (st.behavior === 'متوسط') badgeClass = 'bg-amber-50 text-amber-700 border border-amber-200';
                else if (st.behavior === 'سيء') badgeClass = 'bg-rose-50 text-rose-700 border border-rose-200';

                return `
                    <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-200/80 mb-2">
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center gap-2.5">
                                <span class="w-6 h-6 rounded-full bg-slate-100 text-slate-700 text-xs font-bold flex items-center justify-center">${i+1}</span>
                                <div>
                                    <h4 class="font-bold text-xs text-slate-800">${st.name}</h4>
                                    <p class="text-[10px] text-slate-400">${st.class} (${st.section}) - <strong class="text-indigo-600">${st.studyType || 'صباحي'}</strong></p>
                                </div>
                            </div>
                            <span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full ${badgeClass}" id="beh-badge-${st.id}">
                                ${st.behavior || 'غير محدد'}
                            </span>
                        </div>
                        <div class="flex items-center gap-1.5 pt-2 border-t border-slate-100">
                            <span class="text-[10px] font-bold text-slate-500 ml-1">إضافة علامة:</span>
                            <button onclick="assignStudentMark(${st.id}, 'مميز')" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 py-1 rounded-xl text-[10px] font-black transition-all flex items-center justify-center gap-1">
                                <i class="fa-solid fa-star text-[9px]"></i>
                                <span>مميز</span>
                            </button>
                            <button onclick="assignStudentMark(${st.id}, 'متوسط')" class="flex-1 bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 py-1 rounded-xl text-[10px] font-black transition-all flex items-center justify-center gap-1">
                                <i class="fa-solid fa-minus text-[9px]"></i>
                                <span>متوسط</span>
                            </button>
                            <button onclick="assignStudentMark(${st.id}, 'سيء')" class="flex-1 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 py-1 rounded-xl text-[10px] font-black transition-all flex items-center justify-center gap-1">
                                <i class="fa-solid fa-triangle-exclamation text-[9px]"></i>
                                <span>سيء</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            container.innerHTML = html;
        }

        function assignStudentMark(studentId, mark) {
            const student = appState.students.find(s => s.id === studentId);
            if (!student) return;

            const dateVal = document.getElementById('beh-filter-date').value || new Date().toISOString().split('T')[0];
            const subjectVal = document.getElementById('beh-filter-subject').value || '';
            if (!subjectVal || !isSubjectAssignedToStudentClass(subjectVal, student)) {
                showToast('المادة المختارة غير مرتبطة بصف هذا الطالب وشعبته ونوع دراسته', 'error');
                return;
            }

            student.behavior = mark;
            if (!student.behaviorLog) student.behaviorLog = [];

            student.behaviorLog.push({
                mark: mark,
                stage: student.class,
                section: student.section,
                studyType: student.studyType || "صباحي",
                subject: subjectVal,
                date: dateVal
            });

            const badge = document.getElementById(`beh-badge-${student.id}`);
            if (badge) {
                badge.innerText = mark;
                badge.className = `text-[10px] font-extrabold px-2.5 py-0.5 rounded-full ${mark === 'مميز' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : mark === 'متوسط' ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`;
            }

            persistLocalState();
            showToast(`تم إضافة علامة (${mark}) للطالب ${student.name} بنجاح!`);
        }

        // 4. Schedule Tab Rendering
        function renderScheduleTab(container) {
            let scheduleHtml = `
                <div class="flex bg-white p-1.5 rounded-2xl shadow-sm mb-3.5 border border-slate-200/80 text-xs font-bold gap-2">
                    <div class="flex-1 text-center py-2 bg-slate-900 text-amber-400 rounded-xl shadow-xs flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-calendar-week"></i>
                        <span>جدول الدروس</span>
                    </div>
                    <button onclick="triggerAction('add_schedule_item')" class="flex-1 text-center py-2 bg-amber-50 text-amber-800 hover:bg-amber-100 rounded-xl transition-colors font-bold flex items-center justify-center gap-1.5 border border-amber-200">
                        <i class="fa-solid fa-plus"></i>
                        <span>إضافة درس</span>
                    </button>
                </div>
            `;

            const days = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس"];
            days.forEach(day => {
                const dayClasses = appState.schedule.filter(s => s.day === day);
                scheduleHtml += `
                    <div class="bg-white rounded-3xl p-3.5 shadow-sm border border-slate-200/80 mb-3">
                        <div class="flex justify-between items-center mb-2.5 pb-2 border-b border-slate-100">
                            <div class="flex items-center gap-2">
                                <div class="w-7 h-7 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xs">
                                    <i class="fa-solid fa-calendar-day"></i>
                                </div>
                                <span class="font-extrabold text-slate-800 text-xs">يوم ${day}</span>
                            </div>
                            <span class="text-[10px] bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded-full font-bold border border-emerald-100">${dayClasses.length} دروس</span>
                        </div>
                `;

                if (dayClasses.length === 0) {
                    scheduleHtml += `<p class="text-[11px] text-slate-400 text-center py-2 font-medium">لا توجد دروس في هذا اليوم</p>`;
                } else {
                    dayClasses.forEach(item => {
                        scheduleHtml += `
                            <div class="bg-slate-50/80 rounded-2xl p-2.5 mb-2 border border-slate-100 flex justify-between items-center">
                                <div class="flex items-center gap-2.5">
                                    <div class="w-8 h-8 rounded-xl bg-slate-900 text-amber-400 font-black flex items-center justify-center text-xs shadow-xs">
                                        <i class="fa-regular fa-clock"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-slate-900 text-xs">${item.subject} <span class="text-[11px] text-slate-500 font-medium">(${item.className})</span></h4>
                                        <div class="flex items-center gap-2.5 mt-0.5 text-[10px] text-slate-500">
                                            <span><i class="fa-regular fa-clock text-rose-500 ml-1"></i> ${item.time}</span>
                                            <span><i class="fa-solid fa-location-dot text-indigo-500 ml-1"></i> ${item.hall}</span>
                                        </div>
                                    </div>
                                </div>
                                <button onclick="deleteScheduleItem(${item.id})" class="w-7 h-7 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center hover:bg-rose-100 transition-colors">
                                    <i class="fa-solid fa-trash-can text-[10px]"></i>
                                </button>
                            </div>
                        `;
                    });
                }
                scheduleHtml += `</div>`;
            });

            container.innerHTML = scheduleHtml;
        }

        // 5. Attendance Tab Rendering

        function searchAttendanceStudent() {
            const input = document.getElementById('att-student-search');
            const query = normalizeStudentSearchText(input ? input.value : '');
            const rows = Array.from(document.querySelectorAll('#attendance-rows-box .attendance-student-row'));
            let visible = 0;
            rows.forEach(row => {
                const name = normalizeStudentSearchText(row.getAttribute('data-student-name') || '');
                const match = !query || name.includes(query);
                row.classList.toggle('hidden', !match);
                if (match) visible++;
            });
            const result = document.getElementById('att-student-search-result');
            if (result) result.textContent = query ? `النتائج المطابقة: ${visible} من ${rows.length}` : `عدد الطلبة: ${rows.length}`;
            if (query && visible === 0) showToast('لم يتم العثور على طالب بهذا الاسم في الجلسة الحالية', 'error');
            else if (query && visible === 1) {
                const row = rows.find(item => !item.classList.contains('hidden'));
                if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function saveAttendanceRecord(editingSessionId = null) {
            const classVal = document.getElementById('att-class-select').value;
            const subjectVal = document.getElementById('att-subject-select').value;
            const dateVal = document.getElementById('att-date-input').value;
            const topicVal = String(document.getElementById('att-topic-input')?.value || '').trim();

            if (!classVal || !dateVal) {
                showToast("الرجاء اختيار الصف وتاريخ الدرس", "error");
                return;
            }

            const { name: className, section: sectionPart, studyType: studyPart } = parseClassSelection(classVal);
            const section = sectionPart || "أ";
            const studyType = studyPart || "صباحي";
            if (!subjectVal || !isAssignedSubjectToClass(subjectVal, className, section, studyType)) {
                showToast("لا يمكن حفظ الحضور لمادة غير مرتبطة بهذه الصف والشعبة والدراسة", "error");
                return;
            }
            const dayText = getDayName(dateVal);

            let cleanRecords = {};
            Object.keys(currentAttendanceMap).forEach(k => {
                cleanRecords[k] = currentAttendanceMap[k];
            });

            if (editingSessionId) {
                let sess = appState.savedSessions.find(s => s.id === editingSessionId);
                if (sess) {
                    sess.date = dateVal;
                    sess.className = className;
                    sess.section = section;
                    sess.studyType = studyType;
                    sess.subject = subjectVal;
                    sess.topic = topicVal;
                    sess.records = cleanRecords;
                }
            } else {
                let newSession = {
                    id: Date.now(),
                    date: dateVal,
                    className: className,
                    section: section,
                    studyType: studyType,
                    subject: subjectVal,
                    topic: topicVal,
                    records: cleanRecords
                };
                appState.savedSessions.unshift(newSession);
            }

            currentLoadedAttendanceStudents.forEach(st => {
                let currentStudent = appState.students.find(s => s.id === st.id);
                if (!currentStudent) return;

                if (!currentStudent.absenceLog) currentStudent.absenceLog = [];
                currentStudent.absenceLog = currentStudent.absenceLog.filter(log => log.date !== dateVal);

                let stStatus = cleanRecords[st.id] || cleanRecords[String(st.id)] || 'present';

                if (stStatus === 'absent') {
                    currentStudent.absenceLog.push({ date: dateVal, day: dayText, status: "غائب" });
                } else if (stStatus === 'excused') {
                    currentStudent.absenceLog.push({ date: dateVal, day: dayText, status: "مجاز" });
                }

                let absCount = currentStudent.absenceLog.filter(l => l.status === 'غائب').length;
                let excCount = currentStudent.absenceLog.filter(l => l.status === 'مجاز').length;
                currentStudent.absenceCount = absCount;
                currentStudent.excusedCount = excCount;
                if (!currentStudent.attendanceCount) currentStudent.attendanceCount = 14;
                if (stStatus === 'present' && !editingSessionId) {
                    currentStudent.attendanceCount += 1;
                }
            });

            showToast("تم حفظ جلسة الحضور بنجاح وربطها مع التقارير!");
            persistLocalState();
            renderContent();
        }

        // --- 6. SCHOOL GRADES: monthly averages, midyear, annual work, final exam and result ---
        function gradeNumber(value) {
            if (value === '' || value === null || value === undefined) return null;
            const number = Number(value);
            return Number.isFinite(number) ? number : null;
        }

        function getGradeSubjectContext() {
            if (activeRole === 'student' && studentPortalSubjectContext) return studentPortalSubjectContext;
            if (currentModalType === 'report_view') return (document.getElementById('rep-subject-filter') || {}).value || 'all';
            const gradeSelect = document.getElementById('grd-subject-select');
            if (gradeSelect) return gradeSelect.value || 'all';
            return getSelectedReportSubject();
        }

        function createEmptyGradeRecord() {
            return { term1Month1: '', term1Month1Daily: '', term1Month1Paper: '', term1Month2: '', term1Month2Daily: '', term1Month2Paper: '', term1Month3: '', term1Month3Daily: '', term1Month3Paper: '', midyearMode: 'direct', midyearDirect: '', midyearWritten: '', midyearOral: '', midyearMonth1: '', midyearMonth2: '', term2Month1: '', term2Month1Daily: '', term2Month1Paper: '', term2Month2: '', term2Month2Daily: '', term2Month2Paper: '', term2Month3: '', term2Month3Daily: '', term2Month3Paper: '', finalExam: '' };
        }

        function getStudentGradeRecord(student, subjectName = getGradeSubjectContext(), create = true) {
            if (!student) return createEmptyGradeRecord();
            const subject = String(subjectName || 'all').trim();
            if (!subject || subject === 'all') return student;
            if (normalizeAcademicText(student.subject) === normalizeAcademicText(subject) && !student.gradesBySubject?.[subject]) return student;
            if (!student.gradesBySubject || typeof student.gradesBySubject !== 'object') student.gradesBySubject = {};
            if (!student.gradesBySubject[subject] && create) student.gradesBySubject[subject] = createEmptyGradeRecord();
            return student.gradesBySubject[subject] || createEmptyGradeRecord();
        }

        function getMonthlyAverage(record, prefix, count = 3) {
            const values = [];
            for (let i = 1; i <= count; i++) {
                const value = gradeNumber(record[`${prefix}Month${i}`]);
                if (value !== null) values.push(value);
            }
            return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
        }

        function getTerm1Mark(student) { return roundGradeResult(getMonthlyAverage(getStudentGradeRecord(student, getGradeSubjectContext(), false), 'term1', 3)); }
        function getTerm2Mark(student) { return roundGradeResult(getMonthlyAverage(getStudentGradeRecord(student, getGradeSubjectContext(), false), 'term2', 3)); }

        function calculateMidyearMarkFromRecord(record) {
            record = record || createEmptyGradeRecord();
            if ((record.midyearMode || 'direct') !== 'components') return gradeNumber(record.midyearDirect) || 0;
            const written = gradeNumber(record.midyearWritten) || 0;
            const oral = gradeNumber(record.midyearOral) || 0;
            const values = [written + oral];
            [record.midyearMonth1, record.midyearMonth2].forEach(value => {
                const parsed = gradeNumber(value);
                if (parsed !== null) values.push(parsed);
            });
            return roundGradeResult(values.reduce((sum, value) => sum + value, 0) / values.length);
        }

        function getMidyearMark(student) {
            return calculateMidyearMarkFromRecord(getStudentGradeRecord(student, getGradeSubjectContext(), false));
        }

        // تحديد المادة الافتراضية للطالب نفسه، لكي يستعمل التقرير وواجهة الطالب السجل الدراسي ذاته.
        function getStudentGradeSubjectName(student) {
            if (!student) return 'all';
            const direct = String(student.subject || '').trim();
            if (direct) return direct;
            const keys = Object.keys(student.gradesBySubject || {});
            if (keys.length) return keys[0];
            const linked = (appState.subjects || []).find(item =>
                normalizeAcademicText(item.class) === normalizeAcademicText(student.class) &&
                normalizeAcademicText(item.section) === normalizeAcademicText(student.section) &&
                normalizeAcademicText(item.studyType || 'صباحي') === normalizeAcademicText(student.studyType || 'صباحي')
            );
            return linked && linked.name ? String(linked.name).trim() : 'all';
        }

        // حساب موحد للدرجات المعروضة في واجهة الطالب وتقرير السعي بحسب مادة الطالب المحددة.
        function getStudentGradeSummaryForSubject(student, subjectName) {
            const chosenSubject = String(subjectName || getStudentGradeSubjectName(student) || 'all').trim() || 'all';
            const record = getStudentGradeRecord(student, chosenSubject, false);
            const term1 = getGradeMonthCount(record, 'term1') >= 2
                ? roundGradeResult(getMonthlyAverage(record, 'term1', 3)) : null;
            const term2 = getGradeMonthCount(record, 'term2') >= 2
                ? roundGradeResult(getMonthlyAverage(record, 'term2', 3)) : null;
            const mid = hasMidyearGrade(record) ? calculateMidyearMarkFromRecord(record) : null;
            const annual = term1 !== null && term2 !== null && mid !== null
                ? roundGradeResult((term1 + mid + term2) / 3) : null;
            const finalExam = gradeRecordHasValue(record.finalExam) ? Number(record.finalExam) : null;
            const result = annual === null ? null : (annual >= 90 ? annual : (finalExam === null ? null : roundGradeResult((annual + finalExam) / 2)));
            return { subject: chosenSubject, term1, mid, term2, annual, final: finalExam, result, exempt: annual !== null && annual >= 90 };
        }

        function getAnnualWorkMark(student) {
            return roundGradeResult((getTerm1Mark(student) + getMidyearMark(student) + getTerm2Mark(student)) / 3);
        }

        function getFinalResultMark(student) {
            const annual = getAnnualWorkMark(student);
            const record = getStudentGradeRecord(student, getGradeSubjectContext(), false);
            if (annual >= 90) return annual;
            return roundGradeResult((annual + (gradeNumber(record.finalExam) || 0)) / 2);
        }

        function gradeDisplay(value) {
            const n = Number(value) || 0;
            return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0+$/, '').replace(/\.$/, '');
        }

        function getGradeSubjectOptions() {
            const names = new Set(getAllRegisteredSubjectNames());
            appState.students.forEach(student => { if (student.subject) names.add(String(student.subject).trim()); });
            return Array.from(names).filter(Boolean).sort((a, b) => a.localeCompare(b, 'ar'));
        }

        function updateGradesSectionOptions() {
            const classSelect = document.getElementById('grd-class-select');
            const sectionSelect = document.getElementById('grd-section-select');
            if (!classSelect || !sectionSelect) return;
            const previous = sectionSelect.value;
            const selectedClass = classSelect.value;
            const sections = new Map();
            appState.classes.filter(cls => selectedClass === 'all' || normalizeAcademicText(cls.name) === normalizeAcademicText(selectedClass))
                .forEach(cls => {
                    const value = `${cls.section}||${cls.studyType || 'صباحي'}`;
                    if (!sections.has(value)) sections.set(value, `الشعبة ${cls.section} - ${cls.studyType || 'صباحي'}`);
                });
            sectionSelect.innerHTML = `<option value="all">جميع الشعب</option>` + Array.from(sections.entries()).map(([value, label]) => `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`).join('');
            if (sections.has(previous)) sectionSelect.value = previous;
        }

        function renderGradesTab(container) {
            const classes = Array.from(new Set(appState.classes.map(cls => cls.name))).sort((a, b) => a.localeCompare(b, 'ar'));
            const classOptions = classes.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join('');
            const subjects = getGradeSubjectOptions();
            const subjectOptions = subjects.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join('');
            const tabs = ['الفصل الأول', 'نصف السنة', 'الفصل الثاني', 'السعي السنوي', 'الامتحان النهائي', 'النتيجة'];
            container.innerHTML = `
                <div class="bg-white rounded-3xl p-3.5 shadow-sm border border-slate-200/80 mb-3.5">
                    <div class="flex items-center justify-between gap-2 mb-3">
                        <div class="flex items-center gap-2.5">
                            <div class="w-10 h-10 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center"><i class="fa-solid fa-award text-lg"></i></div>
                            <div><h3 class="font-black text-slate-800 text-sm">إدارة الدرجات</h3><p class="text-[10px] text-slate-400 mt-0.5">اختر الصف والمادة ثم افتح بطاقة الطالب للتعديل</p></div>
                        </div>
                        <span class="text-[9px] font-black px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-100">حفظ مباشر</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mb-2.5">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-600 mb-1">الصف</label>
                            <select id="grd-class-select" onchange="updateGradesSectionOptions(); renderGradesContent()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-[11px] font-bold text-slate-700 outline-none focus:border-indigo-400"><option value="all">جميع الصفوف</option>${classOptions}</select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-600 mb-1">الشعبة</label>
                            <select id="grd-section-select" onchange="renderGradesContent()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-[11px] font-bold text-slate-700 outline-none focus:border-indigo-400"><option value="all">جميع الشعب</option></select>
                        </div>
                        <div class="col-span-2">
                            <label class="block text-[10px] font-bold text-slate-600 mb-1">المادة الدراسية</label>
                            <select id="grd-subject-select" onchange="renderGradesContent()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-[11px] font-bold text-slate-700 outline-none focus:border-indigo-400"><option value="all">جميع المواد</option>${subjectOptions}</select>
                        </div>
                        <div class="col-span-2 relative">
                            <i class="fa-solid fa-magnifying-glass absolute right-3 top-3 text-slate-400 text-xs"></i>
                            <input id="grd-student-search" type="search" placeholder="ابحث عن اسم الطالب..." oninput="renderGradesContent()" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 pr-9 pl-3 text-[11px] font-bold outline-none focus:border-indigo-400">
                        </div>
                    </div>
                    <div class="flex bg-slate-100 p-1 rounded-2xl text-[10px] font-black text-slate-700 gap-1 overflow-x-auto no-scrollbar">
                        ${tabs.map((name, index) => `<button onclick="switchGradesSubTab(${index})" id="grd-subtab-${index}" class="flex-shrink-0 py-2 px-3 rounded-xl transition-all whitespace-nowrap ${index === activeGradesSubTab ? 'bg-slate-900 text-amber-400 shadow-sm' : 'text-slate-600 hover:bg-slate-200'}">${name}</button>`).join('')}
                    </div>
                </div>
                <div id="grades-subtab-content"></div>`;
            updateGradesSectionOptions();
            renderGradesContent();
        }

        function switchGradesSubTab(subIndex) {
            activeGradesSubTab = Math.max(0, Math.min(5, Number(subIndex) || 0));
            for (let i = 0; i < 6; i++) {
                const btn = document.getElementById(`grd-subtab-${i}`);
                if (btn) btn.className = `flex-shrink-0 py-2 px-3 rounded-xl transition-all whitespace-nowrap ${i === activeGradesSubTab ? 'bg-slate-900 text-amber-400 font-black shadow-sm' : 'text-slate-600 hover:bg-slate-200 font-bold'}`;
            }
            renderGradesContent();
        }

        function switchGradeMonth(month) {
            activeGradeMonth = Math.max(1, Math.min(3, Number(month) || 1));
            renderGradesContent();
        }

        function getGradeFilteredStudents() {
            const selectedClass = (document.getElementById('grd-class-select') || {}).value || 'all';
            const selectedSection = (document.getElementById('grd-section-select') || {}).value || 'all';
            const selectedSubject = (document.getElementById('grd-subject-select') || {}).value || 'all';
            const search = String((document.getElementById('grd-student-search') || {}).value || '').trim().toLocaleLowerCase('ar');
            return sortStudentsAlphabetically(appState.students.filter(student => {
                if (selectedClass !== 'all' && normalizeAcademicText(student.class) !== normalizeAcademicText(selectedClass)) return false;
                if (selectedSection !== 'all') {
                    const [section, studyType] = selectedSection.split('||');
                    if (normalizeAcademicText(student.section) !== normalizeAcademicText(section) || normalizeAcademicText(student.studyType || 'صباحي') !== normalizeAcademicText(studyType || 'صباحي')) return false;
                }
                if (selectedSubject !== 'all') {
                    const directMatch = normalizeAcademicText(student.subject) === normalizeAcademicText(selectedSubject);
                    const classLinkMatch = isAssignedSubjectToClass(selectedSubject, student.class, student.section, student.studyType || 'صباحي');
                    if (!directMatch && !classLinkMatch) return false;
                }
                if (search && !String(student.name || '').toLocaleLowerCase('ar').includes(search)) return false;
                return true;
            }));
        }

        function gradeRecordHasValue(value) {
            return value !== '' && value !== null && value !== undefined && Number.isFinite(Number(value));
        }

        function gradeOptionalDisplay(value) {
            return gradeRecordHasValue(value) ? gradeDisplay(value) : '—';
        }

        function getGradeMonthCount(record, prefix) {
            let count = 0;
            [1, 2, 3].forEach(i => { if (gradeRecordHasValue(record[`${prefix}Month${i}`])) count++; });
            return count;
        }

        function roundGradeResult(value) { return value === null || value === undefined || !Number.isFinite(Number(value)) ? value : Math.round(Number(value)); }
        function getGradeTermViewMark(student, prefix) {
            const record = getStudentGradeRecord(student, getGradeSubjectContext(), false);
            const count = getGradeMonthCount(record, prefix);
            return count >= 2 ? roundGradeResult(getMonthlyAverage(record, prefix, 3)) : null;
        }

        function hasMidyearGrade(record) {
            if ((record.midyearMode || 'direct') !== 'components') return gradeRecordHasValue(record.midyearDirect);
            return gradeRecordHasValue(record.midyearWritten) || gradeRecordHasValue(record.midyearOral) || gradeRecordHasValue(record.midyearMonth1) || gradeRecordHasValue(record.midyearMonth2);
        }

        function getAnnualViewMark(student) {
            const term1 = getGradeTermViewMark(student, 'term1');
            const term2 = getGradeTermViewMark(student, 'term2');
            const record = getStudentGradeRecord(student, getGradeSubjectContext(), false);
            if (term1 === null || term2 === null || !hasMidyearGrade(record)) return null;
            return roundGradeResult((term1 + getMidyearMark(student) + term2) / 3);
        }

        function getFinalResultViewMark(student) {
            const annual = getAnnualViewMark(student);
            const record = getStudentGradeRecord(student, getGradeSubjectContext(), false);
            if (annual === null) return null;
            if (annual >= 90) return annual;
            if (!gradeRecordHasValue(record.finalExam)) return null;
            return roundGradeResult((annual + Number(record.finalExam)) / 2);
        }

        function renderGradeStudentCard(student, index) {
            const record = getStudentGradeRecord(student, getGradeSubjectContext(), false);
            const selectedSubject = (document.getElementById('grd-subject-select') || {}).value || 'all';
            const subjectLabel = selectedSubject !== 'all' ? selectedSubject : (student.subject || 'المادة غير محددة');
            const periodInfo = {
                0: { title: `الشهر ${['الأول', 'الثاني', 'الثالث'][activeGradeMonth - 1]}`, color: 'indigo', editable: true },
                1: { title: 'نصف السنة', color: 'violet', editable: true },
                2: { title: `الشهر ${['الأول', 'الثاني', 'الثالث'][activeGradeMonth - 1]}`, color: 'sky', editable: true },
                3: { title: 'السعي السنوي', color: 'amber', editable: false },
                4: { title: 'الامتحان النهائي', color: 'purple', editable: true },
                5: { title: 'النتيجة النهائية', color: 'emerald', editable: false }
            }[activeGradesSubTab];
            let primaryValue = null, secondaryHtml = '', statusHtml = '', actionHtml = '';

            if (activeGradesSubTab === 0 || activeGradesSubTab === 2) {
                const prefix = activeGradesSubTab === 0 ? 'term1' : 'term2';
                primaryValue = gradeRecordHasValue(record[`${prefix}Month${activeGradeMonth}`]) ? Number(record[`${prefix}Month${activeGradeMonth}`]) : null;
                const daily = record[`${prefix}Month${activeGradeMonth}Daily`];
                const paper = record[`${prefix}Month${activeGradeMonth}Paper`];
                const termMark = getGradeTermViewMark(student, prefix);
                const termLabel = activeGradesSubTab === 0 ? 'الفصل الأول' : 'الفصل الثاني';
                secondaryHtml = `
                    <div class="grid grid-cols-2 gap-2 mt-3">
                        <div class="rounded-xl bg-slate-50 border border-slate-100 p-2"><p class="text-[9px] text-slate-400 font-bold mb-1">اليومي / 50</p><p class="text-xs font-black text-slate-700">${gradeOptionalDisplay(daily)}</p></div>
                        <div class="rounded-xl bg-slate-50 border border-slate-100 p-2"><p class="text-[9px] text-slate-400 font-bold mb-1">الورقة / 50</p><p class="text-xs font-black text-slate-700">${gradeOptionalDisplay(paper)}</p></div>
                    </div>
                    <div class="flex items-center justify-between gap-2 mt-2 rounded-xl bg-indigo-50/70 px-3 py-2"><span class="text-[10px] font-bold text-indigo-700">معدل ${termLabel} (يتطلب شهرين على الأقل)</span><strong class="text-sm font-black text-indigo-800">${gradeOptionalDisplay(termMark)} <small class="text-[9px] font-bold">/ 100</small></strong></div>`;
                if (primaryValue !== null && !gradeRecordHasValue(daily) && !gradeRecordHasValue(paper)) {
                    secondaryHtml += `<p class="text-[9px] text-amber-700 mt-2"><i class="fa-solid fa-circle-info ml-1"></i></p>`;
                }
            } else if (activeGradesSubTab === 1) {
                const hasMark = hasMidyearGrade(record);
                primaryValue = hasMark ? getMidyearMark(student) : null;
                secondaryHtml = `<div class="mt-3 rounded-xl bg-violet-50 border border-violet-100 p-3 flex items-center justify-between"><span class="text-[10px] text-violet-700 font-bold">درجة من 100</span><span class="text-xs font-black text-violet-900">${gradeOptionalDisplay(primaryValue)} / 100</span></div>`;
            } else if (activeGradesSubTab === 3) {
                primaryValue = getAnnualViewMark(student);
                secondaryHtml = `<div class="grid grid-cols-3 gap-1.5 mt-3">
                    <div class="rounded-xl bg-indigo-50 p-2 text-center"><p class="text-[9px] text-indigo-500 font-bold">الفصل الأول</p><strong class="text-xs text-indigo-800">${gradeOptionalDisplay(getGradeTermViewMark(student, 'term1'))}</strong></div>
                    <div class="rounded-xl bg-violet-50 p-2 text-center"><p class="text-[9px] text-violet-500 font-bold">نصف السنة</p><strong class="text-xs text-violet-800">${hasMidyearGrade(record) ? gradeDisplay(getMidyearMark(student)) : '—'}</strong></div>
                    <div class="rounded-xl bg-sky-50 p-2 text-center"><p class="text-[9px] text-sky-500 font-bold">الفصل الثاني</p><strong class="text-xs text-sky-800">${gradeOptionalDisplay(getGradeTermViewMark(student, 'term2'))}</strong></div>
                </div><p class="text-[9px] text-slate-400 mt-2">السعي السنوي = (الفصل الأول + نصف السنة + الفصل الثاني) ÷ 3</p>`;
            } else if (activeGradesSubTab === 4) {
                primaryValue = gradeRecordHasValue(record.finalExam) ? Number(record.finalExam) : null;
                const annual = getAnnualViewMark(student);
                secondaryHtml = `<div class="mt-3 rounded-xl bg-amber-50 border border-amber-100 p-3 flex items-center justify-between"><span class="text-[10px] text-amber-700 font-bold">السعي السنوي</span><strong class="text-sm font-black text-amber-900">${gradeOptionalDisplay(annual)} / 100</strong></div>`;
            } else {
                const annual = getAnnualViewMark(student);
                const final = gradeRecordHasValue(record.finalExam) ? Number(record.finalExam) : null;
                primaryValue = getFinalResultViewMark(student);
                const passed = primaryValue !== null && primaryValue >= 50;
                statusHtml = primaryValue === null ? `<span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 text-[9px] font-black">بانتظار اكتمال الدرجات</span>` : `<span class="px-2.5 py-1 rounded-full ${passed ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'} text-[10px] font-black">${passed ? 'ناجح' : 'راسب'}</span>`;
                secondaryHtml = `<div class="grid grid-cols-2 gap-2 mt-3">
                    <div class="rounded-xl bg-amber-50 border border-amber-100 p-2"><p class="text-[9px] text-amber-700 font-bold mb-1">السعي السنوي</p><strong class="text-xs text-amber-900">${gradeOptionalDisplay(annual)} / 100</strong></div>
                    <div class="rounded-xl ${annual !== null && annual >= 90 ? 'bg-emerald-50 border-emerald-100' : 'bg-purple-50 border-purple-100'} border p-2"><p class="text-[9px] ${annual !== null && annual >= 90 ? 'text-emerald-700' : 'text-purple-700'} font-bold mb-1">${annual !== null && annual >= 90 ? 'الامتحان النهائي' : 'النهائي'}</p><strong class="text-xs ${annual !== null && annual >= 90 ? 'text-emerald-800' : 'text-purple-900'}">${annual !== null && annual >= 90 ? 'معفى (سعي 90 فأعلى)' : gradeOptionalDisplay(final) + ' / 100'}</strong></div>
                </div>`;
            }

            if (periodInfo.editable) {
                actionHtml = `<button onclick="openGradeEditorFromButton(this)" data-student-id="${escapeHtml(student.id)}" class="w-full mt-3 bg-slate-900 hover:bg-slate-800 text-amber-400 py-2.5 rounded-xl text-[11px] font-black flex items-center justify-center gap-2 transition-colors"><i class="fa-solid fa-pen-to-square"></i><span>تعديل الدرجة</span></button>`;
            } else if (activeGradesSubTab === 3) {
                actionHtml = `<p class="mt-3 text-[9px] text-slate-400 font-bold text-center"><i class="fa-solid fa-calculator ml-1"></i>يُحسب تلقائياً من الدرجات المسجلة</p>`;
            }

            const primaryColor = primaryValue === null ? 'text-slate-300' : ({ indigo: 'text-indigo-700', violet: 'text-violet-700', sky: 'text-sky-700', amber: 'text-amber-700', purple: 'text-purple-700', emerald: 'text-emerald-700' }[periodInfo.color] || 'text-slate-800');
            const primaryLabel = activeGradesSubTab === 0 || activeGradesSubTab === 2 ? `${periodInfo.title} / 100` : periodInfo.title + (activeGradesSubTab === 3 || activeGradesSubTab === 5 ? ' / 100' : ' / 100');
            return `<article class="bg-white rounded-3xl border border-slate-200/80 p-3.5 shadow-sm">
                <div class="flex items-start justify-between gap-2">
                    <div class="flex items-start gap-2.5 min-w-0">
                        <div class="w-9 h-9 rounded-2xl bg-slate-100 text-slate-500 flex items-center justify-center text-[11px] font-black flex-shrink-0">${index + 1}</div>
                        <div class="min-w-0"><h4 class="text-xs font-black text-slate-800 leading-5 break-words">${escapeHtml(student.name)}</h4><p class="text-[9px] text-slate-400 mt-0.5">${escapeHtml(student.class || '')} · شعبة ${escapeHtml(student.section || '—')} · ${escapeHtml(student.studyType || 'صباحي')}</p><p class="text-[9px] text-indigo-600 font-bold mt-1 truncate"><i class="fa-solid fa-book-open ml-1"></i>${escapeHtml(subjectLabel)}</p></div>
                    </div>
                    <div class="text-left flex-shrink-0"><div class="text-[9px] text-slate-400 font-bold mb-1">${primaryLabel}</div><div class="text-2xl leading-none font-black ${primaryColor}">${gradeOptionalDisplay(primaryValue)}</div>${statusHtml ? `<div class="mt-2">${statusHtml}</div>` : ''}</div>
                </div>
                ${secondaryHtml}
                ${actionHtml}
            </article>`;
        }

        function renderGradesContent() {
            const container = document.getElementById('grades-subtab-content');
            if (!container) return;
            const filtered = getGradeFilteredStudents();
            let monthToolbar = '';
            if (activeGradesSubTab === 0 || activeGradesSubTab === 2) {
                monthToolbar = `<div class="bg-white rounded-2xl border border-slate-200 p-2.5 mb-3 shadow-sm">
                    <p class="text-[10px] font-black text-slate-600 mb-2"><i class="fa-solid fa-calendar-days text-amber-500 ml-1"></i>اختر الشهر لعرض درجاته</p>
                    <div class="grid grid-cols-3 gap-1.5">
                        ${[1, 2, 3].map(month => `<button onclick="switchGradeMonth(${month})" class="py-2 rounded-xl text-[10px] font-black transition-all ${activeGradeMonth === month ? 'bg-slate-900 text-amber-400 shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">الشهر ${['الأول', 'الثاني', 'الثالث'][month - 1]}${month === 3 ? '<span class="block text-[8px] opacity-70 mt-0.5">اختياري</span>' : ''}</button>`).join('')}
                    </div>
                    <p class="text-[9px] text-slate-400 mt-2">درجة كل شهر = يومي من 50 + ورقة من 50. يُحسب معدل الفصل من الشهرين الأول والثاني، ويضاف الثالث اختيارياً.</p>
                </div>`;
            }
            if (!filtered.length) {
                container.innerHTML = monthToolbar + `<div class="bg-white rounded-3xl p-6 text-center border border-slate-200/80"><div class="w-12 h-12 mx-auto rounded-2xl bg-slate-100 flex items-center justify-center text-slate-300 text-xl mb-2"><i class="fa-solid fa-user-slash"></i></div><p class="text-xs text-slate-500 font-bold">لا يوجد طلبة مطابقون للصف والشعبة والمادة أو البحث</p></div>`;
                return;
            }
            const title = ['درجات الفصل الأول', 'درجات نصف السنة', 'درجات الفصل الثاني', 'السعي السنوي', 'الامتحان النهائي', 'النتيجة النهائية'][activeGradesSubTab];
            const summary = `<div class="flex items-center justify-between px-1 mb-2"><h3 class="text-xs font-black text-slate-700">${title}</h3><span class="text-[9px] bg-slate-100 text-slate-500 rounded-full px-2.5 py-1 font-black">${filtered.length} طالب</span></div>`;
            container.innerHTML = monthToolbar + summary + `<div class="space-y-3">${filtered.map((student, index) => renderGradeStudentCard(student, index)).join('')}</div>`;
        }

        function openGradeEditorFromButton(button) {
            if (!button) return;
            openGradeEditor(button.getAttribute('data-student-id'));
        }

        function openGradeEditor(studentId) {
            const student = appState.students.find(item => String(item.id) === String(studentId));
            if (!student) { showToast('تعذر العثور على الطالب', 'error'); return; }
            if (![0, 1, 2, 4].includes(activeGradesSubTab)) { showToast('هذه الدرجة محسوبة تلقائياً ولا تحتاج إلى إدخال يدوي', 'error'); return; }
            const subjectName = (document.getElementById('grd-subject-select') || {}).value || 'all';
            const record = getStudentGradeRecord(student, subjectName);
            const isMonthly = activeGradesSubTab === 0 || activeGradesSubTab === 2;
            const prefix = activeGradesSubTab === 0 ? 'term1' : 'term2';
            const month = activeGradeMonth;
            currentGradeEditContext = { studentId: student.id, subjectName, period: activeGradesSubTab, month };
            currentModalType = 'edit_grade_record';
            const modal = document.getElementById('action-modal');
            const box = document.getElementById('modal-box');
            const titleEl = document.getElementById('modal-title');
            const subtitleEl = document.getElementById('modal-subtitle');
            const bodyEl = document.getElementById('modal-body');
            const iconEl = document.getElementById('modal-icon');
            const submitBtn = document.getElementById('modal-submit-btn');
            titleEl.innerText = isMonthly ? `تعديل درجات ${activeGradesSubTab === 0 ? 'الفصل الأول' : 'الفصل الثاني'}` : (activeGradesSubTab === 1 ? 'تعديل درجة نصف السنة' : 'تعديل درجة الامتحان النهائي');
            subtitleEl.innerText = `${student.name} · ${student.class} · شعبة ${student.section}`;
            iconEl.className = `fa-solid ${isMonthly ? 'fa-calendar-check' : 'fa-pen-to-square'}`;
            if (submitBtn) { submitBtn.style.display = ''; submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk text-xs"></i><span>حفظ الدرجة</span>'; }
            let formHtml = `<div class="rounded-2xl bg-slate-900 text-white p-3.5 mb-3"><div class="flex items-center gap-3"><div class="w-11 h-11 rounded-2xl bg-amber-400/15 border border-amber-300/20 text-amber-400 flex items-center justify-center text-lg"><i class="fa-solid fa-user-graduate"></i></div><div class="min-w-0"><h4 class="font-black text-xs">${escapeHtml(student.name)}</h4><p class="text-[10px] text-slate-300 mt-1">${escapeHtml(student.class)} · الشعبة ${escapeHtml(student.section)} · ${escapeHtml(subjectName === 'all' ? (student.subject || 'جميع المواد') : subjectName)}</p></div></div></div>`;
            if (isMonthly) {
                const dailyKey = `${prefix}Month${month}Daily`, paperKey = `${prefix}Month${month}Paper`, totalKey = `${prefix}Month${month}`;
                const dailyValue = record[dailyKey] ?? '', paperValue = record[paperKey] ?? '';
                const legacyTotal = gradeRecordHasValue(record[totalKey]) && !gradeRecordHasValue(dailyValue) && !gradeRecordHasValue(paperValue);

                    <div class="grid grid-cols-2 gap-3">

            } else if (activeGradesSubTab === 1) {
                let currentValue = '';
                if (hasMidyearGrade(record)) currentValue = (record.midyearMode || 'direct') === 'direct' ? record.midyearDirect : getMidyearMark(student);
                formHtml += `<div class="rounded-2xl bg-violet-50 border border-violet-100 p-3 mb-3"><p class="text-[10px] font-black text-violet-900">درجة نصف السنة</p><p class="text-[9px] text-violet-600 mt-1">تُدخل مباشرة من 100 درجة</p></div>
                    <label class="block text-[10px] font-black text-slate-700 mb-2">الدرجة / 100</label><input id="grade-editor-midyear" type="number" inputmode="decimal" min="0" max="100" step="0.25" value="${currentValue === '' ? '' : escapeHtml(currentValue)}" placeholder="أدخل درجة نصف السنة" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 text-center text-2xl font-black text-slate-800 outline-none focus:border-violet-400">

                    <label class="block text-[10px] font-black text-slate-700 mb-2">درجة الامتحان النهائي / 100</label><input id="grade-editor-final" type="number" inputmode="decimal" min="0" max="100" step="0.25" value="${record.finalExam ?? ''}" placeholder="أدخل درجة الامتحان النهائي" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 text-center text-2xl font-black text-slate-800 outline-none focus:border-purple-400">
                    <p class="text-[9px] text-slate-400 mt-2">النتيجة النهائية = (السعي السنوي + الامتحان النهائي) ÷ 2.</p>`;

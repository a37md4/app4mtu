                    <div class="bg-white border border-slate-200 rounded-3xl p-3.5 space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <div class="col-span-2"><label class="block text-[10px] font-black mb-1">التاريخ</label><input id="part-date-filter" type="date" value="${today}" onchange="renderParticipationStudents()" class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs font-bold"></div>
                            <div class="col-span-2"><label class="block text-[10px] font-black mb-1">الصف والشعبة والدراسة</label><select id="part-class-filter" onchange="renderParticipationStudents()" class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs font-bold">${classOptions}</select></div>
                            <div class="col-span-2"><label class="block text-[10px] font-black mb-1">المادة الدراسية</label><select id="part-subject-filter" onchange="renderParticipationStudents()" class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs font-bold">${subjectOptions}</select></div>
                            <div><label class="block text-[10px] font-black mb-1">بحث عن اسم الطالب</label><input id="part-student-search" type="search" oninput="renderParticipationStudents()" placeholder="اسم الطالب" class="w-full bg-slate-50 border rounded-xl p-2 text-xs font-bold"></div>
                            <div><label class="block text-[10px] font-black mb-1">بحث عن اسم الموضوع</label><input id="part-topic-search" type="search" oninput="renderParticipationStudents()" placeholder="اسم الموضوع" class="w-full bg-slate-50 border rounded-xl p-2 text-xs font-bold"></div>
                        </div>
                        <p class="text-[9px] text-slate-400">تظهر السجلات حسب الفلاتر. اضغط اسم الطالب لفتح بطاقة المشاركة وحفظ البيانات.</p>
                    </div>
                    <div id="participation-student-list" class="space-y-2"></div>
                </div>`;
            renderParticipationStudents();
        }

        function getParticipationFilterParts() {
            const classValue = document.getElementById('part-class-filter')?.value || 'all';
            return { classValue, classParts: classValue === 'all' ? null : parseClassSelection(classValue), date: document.getElementById('part-date-filter')?.value || '', subject: document.getElementById('part-subject-filter')?.value || 'all', studentQuery: normalizeAcademicText(document.getElementById('part-student-search')?.value || ''), topicQuery: normalizeAcademicText(document.getElementById('part-topic-search')?.value || '') };
        }

        function renderParticipationStudents() {
            const list = document.getElementById('participation-student-list');
            if (!list) return;
            const f = getParticipationFilterParts();
            let students = (appState.students || []).filter(st => {
                const classOk = !f.classParts || (normalizeAcademicText(st.class) === normalizeAcademicText(f.classParts.name) && normalizeAcademicText(st.section) === normalizeAcademicText(f.classParts.section) && normalizeAcademicText(st.studyType || 'صباحي') === normalizeAcademicText(f.classParts.studyType || 'صباحي'));
                if (!classOk) return false;
                if (f.studentQuery && !normalizeAcademicText(st.name).includes(f.studentQuery)) return false;
                if (f.subject !== 'all') {
                    const hasEntry = (appState.participationRecords || []).some(r => String(r.studentId) === String(st.id) && normalizeAcademicText(r.subject) === normalizeAcademicText(f.subject) && (!f.date || String(r.date || '') === f.date));
                    if (!hasEntry && !isAssignedSubjectToClass(f.subject, st.class, st.section, st.studyType || 'صباحي') && normalizeAcademicText(st.subject) !== normalizeAcademicText(f.subject)) return false;
                }
                if (f.topicQuery) {
                    const hasTopic = (appState.participationRecords || []).some(r => String(r.studentId) === String(st.id) && (!f.date || String(r.date || '') === f.date) && (f.subject === 'all' || normalizeAcademicText(r.subject) === normalizeAcademicText(f.subject)) && normalizeAcademicText(r.topic || '').includes(f.topicQuery));
                    if (!hasTopic) return false;
                }
                return true;
            }).sort((a, b) => String(a.class || '').localeCompare(String(b.class || ''), 'ar') || String(a.section || '').localeCompare(String(b.section || ''), 'ar') || String(a.name || '').localeCompare(String(b.name || ''), 'ar'));
            if (!students.length) {
                list.innerHTML = '<div class="bg-white border border-slate-200 rounded-2xl p-5 text-center text-xs text-slate-400">لا يوجد طلاب مطابقون للفلاتر الحالية.</div>';
                return;
            }
            list.innerHTML = students.map((st, index) => {
                let records = (appState.participationRecords || []).filter(r => String(r.studentId) === String(st.id) && (!f.date || String(r.date || '') === f.date) && (f.subject === 'all' || normalizeAcademicText(r.subject) === normalizeAcademicText(f.subject)) && (!f.topicQuery || normalizeAcademicText(r.topic || '').includes(f.topicQuery)));
                records.sort((a, b) => String(b.updatedAt || b.date || '').localeCompare(String(a.updatedAt || a.date || '')));
                const latest = records[0];
                const status = latest ? latest.participationStatus || latest.status || '—' : 'لا يوجد سجل';
                const evalText = latest ? latest.evaluation || 'بدون تقييم' : '—';
                const quoteId = String(st.id).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                const statusClass = status === 'مشارك' ? 'participation-pill-positive' : status === 'غير مشاركة' ? 'participation-pill-negative' : 'participation-pill-neutral';
                const statusIcon = status === 'مشارك' ? 'fa-circle-check' : status === 'غير مشاركة' ? 'fa-circle-xmark' : 'fa-clock';
                const evaluationClass = evalText === 'ممتاز' ? 'participation-eval-excellent' : evalText === 'وسط' ? 'participation-eval-medium' : evalText === 'سيء' ? 'participation-eval-poor' : 'participation-pill-neutral';
                return `<article class="participation-student-card">
                    <button type="button" onclick="openParticipationEditor('${quoteId}')" class="w-full text-right block">
                        <div class="flex items-center gap-3">
                            <span class="part-student-avatar"><span class="part-student-index">${index + 1}</span><i class="fa-solid fa-user-graduate"></i></span>
                            <span class="min-w-0 flex-1">
                                <span class="flex items-center justify-between gap-2 flex-wrap">
                                    <b class="block text-xs sm:text-sm font-black text-slate-800">${escapeHtml(st.name)}</b>
                                    <span class="part-status-pill ${statusClass}"><i class="fa-solid ${statusIcon}"></i>${escapeHtml(status)}</span>
                                </span>
                                <span class="flex flex-wrap gap-1.5 mt-2">
                                    <span class="part-meta-chip"><i class="fa-solid fa-layer-group"></i>${escapeHtml(st.class)}</span>
                                    <span class="part-meta-chip"><i class="fa-solid fa-users"></i>شعبة ${escapeHtml(st.section)}</span>
                                    <span class="part-meta-chip"><i class="fa-regular fa-clock"></i>${escapeHtml(st.studyType || 'صباحي')}</span>
                                </span>
                                ${latest ? `<span class="block text-[10px] font-bold text-slate-500 mt-2"><i class="fa-solid fa-book-open ml-1 text-indigo-400"></i>${escapeHtml(latest.subject || '—')} <span class="text-slate-300 mx-1">/</span> <i class="fa-solid fa-bookmark ml-1 text-amber-500"></i>${escapeHtml(latest.topic || 'بدون موضوع')}</span>` : `<span class="block text-[10px] text-slate-400 mt-2">اضغط لفتح بطاقة الطالب وتسجيل المشاركة</span>`}
                            </span>
                            <span class="w-7 h-7 rounded-full bg-slate-50 border border-slate-100 text-slate-400 flex items-center justify-center shrink-0"><i class="fa-solid fa-chevron-left text-[10px]"></i></span>
                        </div>
                    </button>
                    <div class="grid grid-cols-2 gap-2 mt-3">
                        <div class="participation-detail-tile"><span><i class="fa-solid fa-star ml-1 text-amber-400"></i>آخر تقييم</span><b class="part-evaluation-pill ${evaluationClass}">${escapeHtml(evalText)}</b></div>
                        <div class="participation-detail-tile"><span><i class="fa-regular fa-calendar ml-1 text-indigo-400"></i>آخر تسجيل</span><b>${escapeHtml(latest ? latest.date || '—' : 'غير مسجل')}</b></div>
                    </div>
                    ${latest && latest.notes ? `<p class="text-[10px] text-slate-600 bg-indigo-50/70 border border-indigo-100 rounded-xl p-2.5 mt-2 leading-relaxed"><i class="fa-solid fa-note-sticky ml-1 text-indigo-400"></i>${escapeHtml(latest.notes)}</p>` : ''}
                </article>`;
            }).join('');
        }

        function openParticipationEditor(studentId) {
            const st = (appState.students || []).find(item => String(item.id) === String(studentId));
            if (!st) return;
            const f = getParticipationFilterParts();
            const date = f.date || new Date().toISOString().slice(0, 10);
            const assigned = getClassSubjectNames(appState.classes.find(c => normalizeAcademicText(c.name) === normalizeAcademicText(st.class) && normalizeAcademicText(c.section) === normalizeAcademicText(st.section) && normalizeAcademicText(c.studyType || 'صباحي') === normalizeAcademicText(st.studyType || 'صباحي')));
            const subject = f.subject !== 'all' ? f.subject : (isSubjectAssignedToStudentClass(st.subject, st) ? st.subject : assigned[0] || getAllRegisteredSubjectNames()[0] || '');
            const topicSearch = document.getElementById('part-topic-search')?.value || '';
            let matching = (appState.participationRecords || []).filter(r => String(r.studentId) === String(st.id) && String(r.date || '') === date && normalizeAcademicText(r.class) === normalizeAcademicText(st.class) && normalizeAcademicText(r.section) === normalizeAcademicText(st.section) && normalizeAcademicText(r.subject) === normalizeAcademicText(subject));
            const topicQuery = normalizeAcademicText(topicSearch);
            if (topicQuery) matching = matching.filter(r => normalizeAcademicText(r.topic || '').includes(topicQuery));
            matching.sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
            const record = matching[0] || null;
            currentParticipationEditContext = { studentId: String(st.id), recordId: record ? String(record.id) : null };
            const subjectNames = getAllRegisteredSubjectNames();
            const subjectOptions = subjectNames.map(name => `<option value="${escapeHtml(name)}" ${normalizeAcademicText(name) === normalizeAcademicText(record?.subject || subject) ? 'selected' : ''}>${escapeHtml(name)}</option>`).join('');
            const selectedStatus = record?.participationStatus || record?.status || 'مشارك';
            const selectedEvaluation = record?.evaluation || '';
            const choiceButton = (kind, value, label, icon, selected) => `<button type="button" data-part-choice="${kind}" data-part-value="${escapeHtml(value)}" onclick="chooseParticipationOption('${kind}','${value}')" class="part-choice-option ${selected ? 'is-selected' : ''}"><i class="fa-solid ${icon}"></i><span>${label}</span><i class="fa-solid fa-check part-choice-check"></i></button>`;
            const body = `<div class="space-y-4">
                <div class="relative overflow-hidden bg-gradient-to-br from-slate-950 via-indigo-950 to-indigo-800 text-white rounded-3xl p-4 shadow-lg">
                    <div class="absolute -left-3 -bottom-6 text-7xl text-white/5"><i class="fa-solid fa-graduation-cap"></i></div>
                    <div class="relative flex items-center gap-3"><span class="w-12 h-12 rounded-2xl bg-amber-400/15 border border-amber-300/20 text-amber-300 flex items-center justify-center text-xl"><i class="fa-solid fa-user-graduate"></i></span><div class="min-w-0"><p class="text-[10px] text-amber-300 font-black">بطاقة المشاركة الصفية</p><h4 class="text-sm font-black mt-1">${escapeHtml(st.name)}</h4><p class="text-[10px] text-slate-300 mt-1">${escapeHtml(st.class)} · شعبة ${escapeHtml(st.section)} · ${escapeHtml(st.studyType || 'صباحي')}</p></div></div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-[10px] font-black mb-1.5 text-slate-600"><i class="fa-regular fa-calendar ml-1 text-indigo-500"></i>التاريخ</label><input id="part-edit-date" type="date" value="${escapeHtml(record?.date || date)}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold focus:outline-none focus:border-indigo-400"></div>
                    <div><label class="block text-[10px] font-black mb-1.5 text-slate-600"><i class="fa-solid fa-book-open ml-1 text-indigo-500"></i>المادة الدراسية</label><select id="part-edit-subject" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold focus:outline-none focus:border-indigo-400">${subjectOptions || '<option value="">لا توجد مواد مسجلة</option>'}</select></div>
                </div>
                <div><label class="block text-[10px] font-black mb-1.5 text-slate-600"><i class="fa-solid fa-bookmark ml-1 text-amber-500"></i>اسم الموضوع</label><input id="part-edit-topic" type="text" maxlength="180" value="${escapeHtml(record?.topic || topicSearch)}" placeholder="اكتب عنوان الموضوع" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-bold focus:outline-none focus:border-indigo-400"></div>
                <section class="rounded-2xl border border-slate-200 bg-white p-3.5">
                    <div class="part-section-label"><i class="fa-solid fa-hand-paper"></i><span>حالة المشاركة</span></div>
                    <div class="grid grid-cols-2 gap-2">${choiceButton('status', 'مشارك', 'مشارك', 'fa-circle-check', selectedStatus === 'مشارك')}${choiceButton('status', 'غير مشاركة', 'غير مشاركة', 'fa-circle-xmark', selectedStatus === 'غير مشاركة')}</div>
                    <input type="hidden" id="part-edit-status" value="${escapeHtml(selectedStatus)}">
                </section>
                <section class="rounded-2xl border border-slate-200 bg-white p-3.5">
                    <div class="part-section-label"><i class="fa-solid fa-star"></i><span>تقييم الطالب</span></div>
                    <div class="grid grid-cols-2 gap-2">${choiceButton('evaluation', 'ممتاز', 'ممتاز', 'fa-star', selectedEvaluation === 'ممتاز')}${choiceButton('evaluation', 'وسط', 'وسط', 'fa-face-meh', selectedEvaluation === 'وسط')}${choiceButton('evaluation', 'سيء', 'سيء', 'fa-face-frown', selectedEvaluation === 'سيء')}${choiceButton('evaluation', '', 'بدون تقييم', 'fa-minus-circle', !selectedEvaluation)}</div>
                    <input type="hidden" id="part-edit-evaluation" value="${escapeHtml(selectedEvaluation)}">
                </section>
                <div><label class="block text-[10px] font-black mb-1.5 text-slate-600"><i class="fa-solid fa-note-sticky ml-1 text-amber-500"></i>الملاحظات</label><textarea id="part-edit-notes" rows="3" placeholder="اكتب ملاحظات عن مشاركة الطالب" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-bold focus:outline-none focus:border-indigo-400">${escapeHtml(record?.notes || '')}</textarea></div>
            </div>`;
            openDailyGradeModal('بطاقة المشاركة الصفية', body, 'edit_participation');
        }

        function chooseParticipationOption(field, value) {
            const inputId = field === 'status' ? 'part-edit-status' : field === 'evaluation' ? 'part-edit-evaluation' : '';
            const input = inputId ? document.getElementById(inputId) : null;
            if (!input) return;
            input.value = value;
            document.querySelectorAll(`[data-part-choice="${field}"]`).forEach(button => {
                button.classList.toggle('is-selected', button.getAttribute('data-part-value') === value);
            });
        }

        function saveParticipationRecord() {
            const context = currentParticipationEditContext;
            if (!context) { showToast('تعذر تحديد الطالب المراد حفظ مشاركته', 'error'); return; }
            const st = (appState.students || []).find(item => String(item.id) === String(context.studentId));
            if (!st) { showToast('لم يتم العثور على الطالب', 'error'); return; }
            const date = String(document.getElementById('part-edit-date')?.value || '').trim();
            const subject = String(document.getElementById('part-edit-subject')?.value || '').trim();
            const topic = String(document.getElementById('part-edit-topic')?.value || '').trim();
            const participationStatus = String(document.getElementById('part-edit-status')?.value || 'مشارك');
            const evaluation = String(document.getElementById('part-edit-evaluation')?.value || '');
            const notes = String(document.getElementById('part-edit-notes')?.value || '').trim();
            if (!date) { showToast('حدد تاريخ المشاركة أولاً', 'error'); return; }
            if (!subject) { showToast('اختر المادة الدراسية أولاً', 'error'); return; }
            let record = context.recordId ? (appState.participationRecords || []).find(r => String(r.id) === String(context.recordId)) : null;
            const now = new Date().toISOString();
            const values = { studentId: st.id, studentName: st.name, class: st.class, section: st.section, studyType: st.studyType || 'صباحي', date, subject, topic, participationStatus, status: participationStatus, evaluation, notes, updatedAt: now };
            if (record) Object.assign(record, values);
            else {
                if (!Array.isArray(appState.participationRecords)) appState.participationRecords = [];
                appState.participationRecords.push({ id: Date.now() + Math.random(), createdAt: now, ...values });
            }
            persistLocalState();
            closeModal();
            showToast('تم حفظ سجل مشاركة الطالب محلياً');
            renderParticipationStudents();
        }

        function getFilteredParticipationReportRecords() {
            const from = document.getElementById('rep-part-from')?.value || '';
            const to = document.getElementById('rep-part-to')?.value || '';
            const classValue = document.getElementById('rep-part-class')?.value || 'all';
            const parts = classValue === 'all' ? null : parseClassSelection(classValue);
            const subject = document.getElementById('rep-part-subject')?.value || 'all';
            const studentQuery = normalizeAcademicText(document.getElementById('rep-part-student-search')?.value || '');
            const topicQuery = normalizeAcademicText(document.getElementById('rep-part-topic-search')?.value || '');
            return (appState.participationRecords || []).filter(r => {
                if (from && String(r.date || '') < from) return false;
                if (to && String(r.date || '') > to) return false;
                if (parts && !(normalizeAcademicText(r.class) === normalizeAcademicText(parts.name) && normalizeAcademicText(r.section) === normalizeAcademicText(parts.section) && normalizeAcademicText(r.studyType || 'صباحي') === normalizeAcademicText(parts.studyType || 'صباحي'))) return false;
                if (subject !== 'all' && normalizeAcademicText(r.subject) !== normalizeAcademicText(subject)) return false;
                if (studentQuery && !normalizeAcademicText(r.studentName || '').includes(studentQuery)) return false;
                if (topicQuery && !normalizeAcademicText(r.topic || '').includes(topicQuery)) return false;
                return true;
            }).slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || String(a.class || '').localeCompare(String(b.class || ''), 'ar') || String(a.section || '').localeCompare(String(b.section || ''), 'ar') || String(a.studentName || '').localeCompare(String(b.studentName || ''), 'ar'));
        }

        function renderParticipationReportRows() {
            const body = document.getElementById('participation-report-body');
            if (!body) return;
            const rows = getFilteredParticipationReportRecords();
            body.innerHTML = rows.length ? rows.map((r, i) => `<tr class="border-b border-slate-100 text-[10px]"><td class="p-2 text-center">${i + 1}</td><td class="p-2">${escapeHtml(r.date || '')}</td><td class="p-2 font-bold">${escapeHtml(r.studentName || '')}</td><td class="p-2">${escapeHtml(r.class || '')}</td><td class="p-2">${escapeHtml(r.section || '')}</td><td class="p-2">${escapeHtml(r.subject || '')}</td><td class="p-2">${escapeHtml(r.topic || '—')}</td><td class="p-2">${escapeHtml(r.participationStatus || r.status || '')}</td><td class="p-2">${escapeHtml(r.evaluation || '—')}</td><td class="p-2">${escapeHtml(r.notes || '—')}</td></tr>`).join('') : '<tr><td colspan="10" class="p-4 text-center text-xs text-slate-400">لا توجد سجلات مشاركة مطابقة للفلاتر</td></tr>';
            const classValue = document.getElementById('rep-part-class')?.value || 'all';
            setPrintHeaderStageLabelUnified('rep-participation-stage', classValue);
        }

        function exportParticipationReportCSV() {
            const rows = getFilteredParticipationReportRecords();
            downloadCsvFile([['التاريخ', 'اسم الطالب', 'الصف', 'الشعبة', 'نوع الدراسة', 'المادة', 'الموضوع', 'المشاركة', 'التقييم', 'الملاحظات'], ...rows.map(r => [r.date, r.studentName, r.class, r.section, r.studyType, r.subject, r.topic, r.participationStatus || r.status, r.evaluation, r.notes])], 'participation_report.csv');
        }

        function renderDailyGradesTab(container) {
            const classOptions = `<option value="all">جميع الصفوف والشعب</option>` + appState.classes.map(c=>`<option value="${escapeHtml(c.name)} - ${escapeHtml(c.section)} - ${escapeHtml(c.studyType||'صباحي')}">${escapeHtml(c.name)} (شعبة ${escapeHtml(c.section)} - ${escapeHtml(c.studyType||'صباحي')})</option>`).join('');
            container.innerHTML = `<div class="space-y-3"><div class="bg-gradient-to-r from-slate-900 to-indigo-950 text-white rounded-3xl p-4"><div class="flex items-center gap-3"><div class="w-11 h-11 rounded-2xl bg-amber-400/15 text-amber-300 flex items-center justify-center text-xl"><i class="fa-solid fa-clipboard-check"></i></div><div><h3 class="font-black text-sm">درجة اليومي</h3><p class="text-[10px] text-slate-300 mt-1">أضف عدة درجات للطالب عبر تواريخ مختلفة أو في التاريخ نفسه</p></div></div></div><div class="bg-white border border-slate-200 rounded-3xl p-3.5 space-y-3"><div><label class="block text-[10px] font-black mb-1">الصف والشعبة</label><select id="daily-class-select" onchange="renderDailyGradeStudents()" class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs font-bold">${classOptions}</select></div><div class="grid grid-cols-2 gap-2"><div><label class="block text-[10px] font-black mb-1">الفصل</label><select id="daily-term-select" onchange="renderDailyGradeStudents()" class="w-full bg-slate-50 border rounded-xl p-2 text-xs font-bold"><option value="term1">الفصل الأول</option><option value="term2">الفصل الثاني</option></select></div><div><label class="block text-[10px] font-black mb-1">الشهر</label><select id="daily-month-select" onchange="renderDailyGradeStudents()" class="w-full bg-slate-50 border rounded-xl p-2 text-xs font-bold"><option value="1">الأول</option><option value="2">الثاني</option></select></div><div class="col-span-2"><label class="block text-[10px] font-black mb-1">تاريخ الدرجة الجديدة</label><input id="daily-date-select" type="date" value="${new Date().toISOString().slice(0,10)}" class="w-full bg-slate-50 border rounded-xl p-2 text-xs font-bold"></div><div class="col-span-2"><label class="block text-[10px] font-black mb-1">الدرجة القصوى (يمكن تعديلها)</label><input id="daily-max-select" type="number" inputmode="decimal" min="0.01" step="any" value="${escapeHtml(appState.dailyGradeMaxMark || 5)}" onchange="updateDailyGradeMax()" class="w-full bg-slate-50 border rounded-xl p-2 text-xs font-bold" placeholder="أدخل أي درجة قصوى"></div></div><div><label class="block text-[10px] font-black mb-1">بحث عن اسم الطالب</label><input id="daily-student-search" type="search" oninput="renderDailyGradeStudents()" placeholder="اكتب اسم الطالب للبحث..." class="w-full bg-slate-50 border rounded-xl p-2.5 text-xs font-bold"></div></div><div id="daily-grade-students" class="space-y-2"></div></div>`;
            renderDailyGradeStudents();
        }

        function updateDailyGradeMax() {
            const input = document.getElementById('daily-max-select');
            const max = Number(input?.value);
            if (!Number.isFinite(max) || max <= 0) {
                if (input) input.value = String(appState.dailyGradeMaxMark || 5);
                showToast('أدخل درجة قصوى صحيحة أكبر من صفر', 'error');
                return;
            }
            appState.dailyGradeMaxMark = max;
            document.querySelectorAll('#daily-grade-students input[id^="daily-grade-"]').forEach(markInput => {
                markInput.max = String(max);
                markInput.placeholder = `0–${max}`;
            });
            document.querySelectorAll('#daily-grade-students .daily-grade-max-label').forEach(label => label.textContent = `درجة جديدة من ${max}`);
            persistLocalState();
            showToast(`تم اعتماد الدرجة القصوى ${max} وحفظها على الجهاز`);
        }

        function getDailyGradeRecord(studentId, term, month) {
            return (appState.dailyGrades || []).find(r => String(r.studentId) === String(studentId) && r.term === term && String(r.month) === String(month));
        }

        function getDailyGradeById(recordId) {
            return (appState.dailyGrades || []).find(record => String(record.id) === String(recordId));
        }

        function renderDailyGradeStudents() {
            const box = document.getElementById('daily-grade-students'); if (!box) return;
            const classVal = document.getElementById('daily-class-select')?.value || 'all';
            const term = document.getElementById('daily-term-select')?.value || 'term1';
            const month = document.getElementById('daily-month-select')?.value || '1';
            const max = Number(document.getElementById('daily-max-select')?.value || 5);
            const query = String(document.getElementById('daily-student-search')?.value || '').trim().toLocaleLowerCase('ar');
            const cls = parseClassSelection(classVal);
            let students = appState.students.filter(st => (classVal === 'all' || (normalizeAcademicText(st.class) === normalizeAcademicText(cls.name) && normalizeAcademicText(st.section) === normalizeAcademicText(cls.section) && normalizeAcademicText(st.studyType || 'صباحي') === normalizeAcademicText(cls.studyType || 'صباحي'))) && (!query || String(st.name || '').toLocaleLowerCase('ar').includes(query)));
            students = sortStudentsAlphabetically(students);
            if (!students.length) { box.innerHTML = '<div class="bg-white rounded-2xl p-5 text-center text-xs text-slate-400 border">لا يوجد طلبة مطابقون للبحث أو الصف والشعبة</div>'; return; }
            box.innerHTML = `<div class="flex justify-between items-center px-1"><h3 class="text-xs font-black text-slate-700">قائمة الطلبة</h3><span class="text-[9px] text-slate-400">${students.length} طالب</span></div>` + students.map((st, i) => {
                const records = (appState.dailyGrades || []).filter(r => String(r.studentId) === String(st.id) && r.term === term && String(r.month) === String(month)).sort((a,b) => String(b.date||'').localeCompare(String(a.date||'')) || String(b.id||'').localeCompare(String(a.id||'')));
                const safeId = String(st.id).replace(/[^\w-]/g, '_');
                const quotedId = String(st.id).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                const history = records.length ? `<div class="mt-3 border-t border-slate-100 pt-2 space-y-2"><p class="text-[9px] font-black text-slate-500">الدرجات المحفوظة لهذا الشهر (${records.length})</p>${records.map((record, ix) => `<div class="flex items-center justify-between gap-2 bg-slate-50 rounded-xl p-2"><div class="min-w-0"><p class="text-[10px] font-black text-slate-700">${escapeHtml(record.date || 'تاريخ غير محدد')} · ${escapeHtml(record.mark)} / ${escapeHtml(record.maxMark)}</p><p class="text-[8px] text-slate-400">درجة رقم ${records.length - ix}</p></div><div class="flex gap-1 shrink-0"><button type="button" onclick="editDailyGradeRecord('${String(record.id).replace(/'/g,'')}')" class="rounded-lg bg-sky-50 text-sky-700 border border-sky-100 px-2 py-1 text-[9px] font-black">تعديل</button><button type="button" onclick="deleteDailyGradeRecord('${String(record.id).replace(/'/g,'')}')" class="rounded-lg bg-rose-50 text-rose-700 border border-rose-100 px-2 py-1 text-[9px] font-black">حذف</button></div></div>`).join('')}</div>` : '<p class="text-[9px] text-slate-400 mt-2">لا توجد درجة محفوظة لهذا الطالب في الشهر المحدد</p>';
                return `<article class="bg-white border border-slate-200 rounded-2xl p-3"><div class="flex items-center gap-3"><div class="w-8 h-8 shrink-0 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center text-xs font-black">${i + 1}</div><div class="min-w-0 flex-1"><h4 class="text-xs font-black text-slate-800">${escapeHtml(st.name)}</h4><p class="text-[9px] text-slate-400 mt-1">${escapeHtml(st.class)} · ${escapeHtml(st.section)} · ${escapeHtml(st.studyType || 'صباحي')}</p></div><div class="w-20 shrink-0"><input id="daily-grade-${safeId}" data-student-id="${escapeHtml(st.id)}" type="number" inputmode="decimal" min="0" max="${max}" step="any" value="" placeholder="0–${max}" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-center text-sm font-black outline-none"><p class="daily-grade-max-label text-[8px] text-center text-slate-400 mt-1">درجة جديدة من ${max}</p></div></div><div class="flex flex-wrap items-center justify-end gap-1.5 mt-3"><button type="button" onclick="saveDailyGrade('${quotedId}')" class="flex items-center gap-1 bg-slate-900 text-amber-400 rounded-xl px-3 py-2 text-[10px] font-black"><i class="fa-solid fa-plus"></i><span>إضافة درجة</span></button><button type="button" onclick="viewDailyGradeDetails('${quotedId}')" class="flex items-center gap-1 bg-indigo-50 text-indigo-700 border border-indigo-100 rounded-xl px-2.5 py-2 text-[10px] font-black"><i class="fa-solid fa-eye"></i><span>عرض الكل</span></button></div>${history}</article>`;
            }).join('');
        }

        function saveDailyGrade(studentId) {
            const st = appState.students.find(s => String(s.id) === String(studentId)); if (!st) return;
            const inputId = 'daily-grade-' + String(st.id).replace(/[^\w-]/g, '_');
            const input = document.getElementById(inputId);
            const mark = String(input?.value ?? '').trim();
            const term = document.getElementById('daily-term-select')?.value || 'term1';
            const month = document.getElementById('daily-month-select')?.value || '1';
            const max = Number(document.getElementById('daily-max-select')?.value || appState.dailyGradeMaxMark || 5);
            if (!Number.isFinite(max) || max <= 0) { showToast('أدخل درجة قصوى صحيحة أكبر من صفر', 'error'); return; }
            if (mark === '' || !Number.isFinite(Number(mark)) || Number(mark) < 0 || Number(mark) > max) { showToast(`أدخل درجة من 0 إلى ${max}`, 'error'); return; }
            const selectedDate = document.getElementById('daily-date-select')?.value || new Date().toISOString().slice(0, 10);
            const data = { id: Date.now() + Math.random(), studentId: st.id, studentName: st.name, class: st.class, section: st.section, studyType: st.studyType || 'صباحي', term, month, maxMark: max, mark: Number(mark), date: selectedDate, createdAt: new Date().toISOString() };
            // كل عملية حفظ تضيف سجلاً مستقلاً؛ لا تُستبدل درجات الطالب السابقة.
            if (!Array.isArray(appState.dailyGrades)) appState.dailyGrades = [];
            appState.dailyGrades.push(data);
            persistLocalState(); showToast('تمت إضافة درجة يومي جديدة للطالب'); renderDailyGradeStudents();
        }

        function openDailyGradeModal(title, bodyHtml, mode) {
            const modal = document.getElementById('action-modal');
            const box = document.getElementById('modal-box');
            const titleEl = document.getElementById('modal-title');
            const subtitleEl = document.getElementById('modal-subtitle');
            const iconEl = document.getElementById('modal-icon');
            const bodyEl = document.getElementById('modal-body');
            const submitBtn = document.getElementById('modal-submit-btn');
            if (!modal || !box || !titleEl || !bodyEl) return;
            currentModalType = mode;
            titleEl.textContent = title;
            if (subtitleEl) subtitleEl.textContent = mode === 'edit_daily_grade' ? 'تعديل درجة الطالب المحفوظة' : mode === 'edit_participation' ? 'تسجيل مشاركة الطالب وتقييمه وملاحظاته' : 'تفاصيل سجل درجات الطالب';
            if (iconEl) iconEl.className = mode === 'edit_participation' ? 'fa-solid fa-hand-paper' : 'fa-solid fa-clipboard-check';
            bodyEl.innerHTML = bodyHtml;
            if (submitBtn) {
                if (mode === 'edit_daily_grade' || mode === 'edit_participation') {
                    submitBtn.style.display = '';
                    submitBtn.innerHTML = mode === 'edit_participation' ? '<i class="fa-solid fa-check text-xs"></i><span>حفظ المشاركة</span>' : '<i class="fa-solid fa-check text-xs"></i><span>حفظ التعديل</span>';
                } else submitBtn.style.display = 'none';
            }
            modal.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-95'); box.classList.add('scale-100');
        }
        function editDailyGrade(studentId) {
            const term = document.getElementById('daily-term-select')?.value || 'term1';
            const month = document.getElementById('daily-month-select')?.value || '1';
            const record = getDailyGradeRecord(studentId, term, month);
            if (record) editDailyGradeRecord(record.id);
            else showToast('لا توجد درجة محفوظة للتعديل', 'error');
        }

        function editDailyGradeRecord(recordId) {
            const record = getDailyGradeById(recordId);
            if (!record) { showToast('تعذر العثور على درجة اليومي', 'error'); return; }
            const st = appState.students.find(s => String(s.id) === String(record.studentId));
            currentDailyGradeEditContext = { recordId: String(record.id), studentId: String(record.studentId), term: record.term, month: String(record.month) };
            openDailyGradeModal('تعديل درجة اليومي', `<div class="space-y-3"><div class="bg-slate-50 border rounded-2xl p-3"><p class="text-[10px] text-slate-500">اسم الطالب</p><h4 class="font-black text-sm text-slate-800 mt-1">${escapeHtml(st?.name || record.studentName || '')}</h4><p class="text-[10px] text-slate-500 mt-1">${record.term === 'term1' ? 'الفصل الأول' : 'الفصل الثاني'} · الشهر ${String(record.month) === '1' ? 'الأول' : 'الثاني'} · ${escapeHtml(record.date || '')}</p></div><div><label class="block text-[10px] font-black mb-1">الدرجة</label><input id="daily-grade-edit-mark" type="number" inputmode="decimal" min="0" max="${Number(record.maxMark)||5}" step="any" value="${escapeHtml(record.mark)}" class="w-full bg-slate-50 border rounded-xl p-3 text-sm font-black"></div><div><label class="block text-[10px] font-black mb-1">الدرجة القصوى</label><input id="daily-grade-edit-max" type="number" min="0.01" step="any" value="${escapeHtml(Number(record.maxMark) || 5)}" class="w-full bg-slate-50 border rounded-xl p-3 text-sm font-bold"></div><div><label class="block text-[10px] font-black mb-1">تاريخ الدرجة</label><input id="daily-grade-edit-date" type="date" value="${escapeHtml(record.date || '')}" class="w-full bg-slate-50 border rounded-xl p-3 text-sm font-bold"></div></div>`, 'edit_daily_grade');
            const markInput = document.getElementById('daily-grade-edit-mark');
            const maxInput = document.getElementById('daily-grade-edit-max');
            if (markInput && maxInput) { markInput.max = maxInput.value; maxInput.onchange = () => { markInput.max = maxInput.value; }; }
        }

        function saveEditedDailyGrade() {
            const context = currentDailyGradeEditContext;
            if (!context) { showToast('تعذر تحديد الدرجة المراد تعديلها', 'error'); return; }
            const record = context.recordId ? getDailyGradeById(context.recordId) : getDailyGradeRecord(context.studentId, context.term, context.month);
            const markText = String(document.getElementById('daily-grade-edit-mark')?.value ?? '').trim();
            const maxMark = Number(document.getElementById('daily-grade-edit-max')?.value || 0);
            const date = String(document.getElementById('daily-grade-edit-date')?.value || '').trim();
            if (!record) { showToast('لم تعد الدرجة موجودة في السجل', 'error'); closeModal(); return; }
            if (!Number.isFinite(maxMark) || maxMark <= 0) { showToast('أدخل درجة قصوى صحيحة أكبر من صفر', 'error'); return; }
            if (markText === '' || !Number.isFinite(Number(markText)) || Number(markText) < 0 || Number(markText) > maxMark) { showToast(`أدخل درجة من 0 إلى ${maxMark}`, 'error'); return; }
            const st = appState.students.find(s => String(s.id) === String(record.studentId));
            record.mark = Number(markText); record.maxMark = maxMark; record.date = date || record.date || new Date().toISOString().slice(0, 10);
            appState.dailyGradeMaxMark = maxMark;
            if (st) { record.studentName = st.name; record.class = st.class; record.section = st.section; record.studyType = st.studyType || 'صباحي'; }
            persistLocalState(); closeModal(); showToast('تم تعديل الدرجة وحفظها'); renderDailyGradeStudents();
        }

        function deleteDailyGrade(studentId) {
            const term = document.getElementById('daily-term-select')?.value || 'term1';
            const month = document.getElementById('daily-month-select')?.value || '1';
            const record = getDailyGradeRecord(studentId, term, month);
            if (record) deleteDailyGradeRecord(record.id);
            else showToast('لا توجد درجة محفوظة لهذا الطالب في الاختيار الحالي', 'error');
        }

        function deleteDailyGradeRecord(recordId) {
            const record = getDailyGradeById(recordId);
            if (!record) { showToast('لا توجد درجة محفوظة لحذفها', 'error'); return; }
            const st = appState.students.find(s => String(s.id) === String(record.studentId));
            if (!confirm(`هل تريد حذف درجة اليومي المؤرخة ${record.date || ''} للطالب ${st?.name || record.studentName}؟`)) return;
            appState.dailyGrades = (appState.dailyGrades || []).filter(r => String(r.id) !== String(recordId));
            persistLocalState(); showToast('تم حذف درجة اليومي المحددة'); renderDailyGradeStudents();
        }

        function viewDailyGradeDetails(studentId) {
            const st = appState.students.find(s => String(s.id) === String(studentId));
            if (!st) return;
            const records = (appState.dailyGrades || []).filter(r => String(r.studentId) === String(studentId)).slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || String(a.term).localeCompare(String(b.term)) || String(a.month).localeCompare(String(b.month)));
            const rows = records.map((r, i) => `<div class="bg-white border border-slate-200 rounded-2xl p-3"><div class="flex items-start justify-between gap-2"><div><p class="text-[9px] text-slate-400">السجل ${i + 1} · ${escapeHtml(r.date || 'التاريخ غير محدد')}</p><h5 class="text-xs font-black text-slate-800 mt-1">${r.term === 'term1' ? 'الفصل الأول' : 'الفصل الثاني'} · الشهر ${String(r.month) === '1' ? 'الأول' : String(r.month) === '2' ? 'الثاني' : escapeHtml(r.month)}</h5><p class="text-[9px] text-slate-500 mt-1">${escapeHtml(r.class || st.class)} · شعبة ${escapeHtml(r.section || st.section)} · ${escapeHtml(r.studyType || st.studyType || 'صباحي')}</p></div><div class="text-center bg-indigo-50 border border-indigo-100 rounded-xl px-3 py-2 shrink-0"><b class="block text-lg text-indigo-800">${escapeHtml(r.mark)}</b><span class="text-[9px] text-slate-500">من ${escapeHtml(r.maxMark)}</span></div></div></div>`).join('');
            openDailyGradeModal('تفاصيل درجات الطالب', `<div class="bg-gradient-to-r from-slate-900 to-indigo-950 text-white rounded-2xl p-4 mb-3"><p class="text-[10px] text-amber-300">بطاقة الطالب</p><h4 class="text-base font-black mt-1">${escapeHtml(st.name)}</h4><p class="text-[10px] text-slate-300 mt-1">${escapeHtml(st.class)} · شعبة ${escapeHtml(st.section)} · ${escapeHtml(st.studyType || 'صباحي')}</p><div class="mt-3 pt-3 border-t border-white/10 flex justify-between"><span class="text-[10px] text-slate-300">عدد الدرجات المسجلة</span><b class="text-sm">${records.length}</b></div></div><div class="space-y-2">${rows || '<div class="bg-slate-50 border rounded-2xl p-5 text-center text-xs text-slate-400">لا توجد درجات يومي مسجلة لهذا الطالب بعد</div>'}</div>`, 'view_daily_student_grades');
        }
        function selectedDailyGradesForReport() {
            const classVal=document.getElementById('rep-daily-class')?.value||'all'; const term=document.getElementById('rep-daily-term')?.value||'term1'; const month=document.getElementById('rep-daily-month')?.value||'1'; const parsed=parseClassSelection(classVal);
            return (appState.dailyGrades||[]).filter(r=>r.term===term&&String(r.month)===String(month)&&(classVal==='all'||(normalizeAcademicText(r.class)===normalizeAcademicText(parsed.name)&&normalizeAcademicText(r.section)===normalizeAcademicText(parsed.section)&&normalizeAcademicText(r.studyType||'صباحي')===normalizeAcademicText(parsed.studyType||'صباحي')))).sort((a,b)=>String(a.class).localeCompare(String(b.class),'ar')||String(a.section).localeCompare(String(b.section),'ar')||String(a.studentName).localeCompare(String(b.studentName),'ar'));
        }
        function renderDailyGradesReportRows() {
            const body=document.getElementById('daily-grades-report-body');if(!body)return;
            const rows=selectedDailyGradesForReport();
            body.innerHTML=rows.length?rows.map((r,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(r.studentName||'')}</td><td>${escapeHtml(r.class||'')} / ${escapeHtml(r.section||'')}</td><td>${r.term==='term1'?'الأول':'الثاني'}</td><td>${r.month==='1'?'الأول':'الثاني'}</td><td style="text-align:center">${escapeHtml(r.mark)} / ${escapeHtml(r.maxMark)}</td><td>${escapeHtml(r.date||'')}</td></tr>`).join(''):'<tr><td colspan="7" class="p-4 text-center text-slate-400">لا توجد درجات محفوظة لهذه التصفية</td></tr>';
            setPrintHeaderStageLabelUnified('rep-daily-stage',document.getElementById('rep-daily-class')?.value||'all');
        }
        function exportDailyGradesReportCSV() {
            const rows=selectedDailyGradesForReport();const data=[['اسم الطالب','الصف','الشعبة','الفصل','الشهر','الدرجة','الدرجة القصوى','التاريخ'],...rows.map(r=>[r.studentName,r.class,r.section,r.term==='term1'?'الفصل الأول':'الفصل الثاني',r.month==='1'?'الشهر الأول':'الشهر الثاني',r.mark,r.maxMark,r.date])];
            downloadCsvFile(data,'daily_grades_report.csv');
        }
        function filterCodeReportStudents() {
            const classVal=document.getElementById('rep-codes-class')?.value||'all';const subject=document.getElementById('rep-subject-filter')?.value||'all';const parsed=parseClassSelection(classVal);
            return sortStudentsAlphabetically(appState.students.filter(st=>{
                const cOk=classVal==='all'||(normalizeAcademicText(st.class)===normalizeAcademicText(parsed.name)&&normalizeAcademicText(st.section)===normalizeAcademicText(parsed.section)&&normalizeAcademicText(st.studyType||'صباحي')===normalizeAcademicText(parsed.studyType||'صباحي'));
                const sOk=subject==='all'||normalizeAcademicText(st.subject)===normalizeAcademicText(subject)||(st.gradesBySubject&&Object.keys(st.gradesBySubject).some(k=>normalizeAcademicText(k)===normalizeAcademicText(subject)));
                return cOk&&sOk;
            }));
        }
        function renderStudentCodesReportRows() {
            const body=document.getElementById('student-codes-report-body');if(!body)return;
            const rows=filterCodeReportStudents();const chosenSubject=document.getElementById('rep-subject-filter')?.value||'all';body.innerHTML=rows.length?rows.map((st,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(st.name)}</td><td>${escapeHtml(st.class)} / ${escapeHtml(st.section)} / ${escapeHtml(st.studyType||'صباحي')}</td><td>${escapeHtml(chosenSubject!=='all'?chosenSubject:(st.subject||Object.keys(st.gradesBySubject||{})[0]||'—'))}</td><td dir="ltr" style="text-align:center;font-weight:bold">${escapeHtml(st.loginCode||'')}</td></tr>`).join(''):'<tr><td colspan="5" class="p-4 text-center text-slate-400">لا يوجد طلبة مطابقون للتصفية</td></tr>';
            const parsed=document.getElementById('rep-codes-class')?.value||'all';setPrintHeaderStageLabelUnified('rep-codes-stage',parsed);
        }
        function exportStudentCodesReportCSV() {
            const rows=filterCodeReportStudents();downloadCsvFile([['اسم الطالب','الصف','الشعبة','نوع الدراسة','المادة','رمز الدخول'],...rows.map(st=>[st.name,st.class,st.section,st.studyType||'صباحي',st.subject||'',st.loginCode||''])],'student_login_codes.csv');
        }
        function downloadCsvFile(rows, filename) {
            const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
            const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('تم تصدير التقرير بصيغة CSV');
        }

        function showToast(msg, type = "success") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-4');
            toast.classList.add('translate-y-0');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4');
                toast.classList.remove('translate-y-0');
            }, 2000);
        }

        window.onload = function() {
            try {
                const cached = localStorage.getItem('sp_academic_local_data');
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (parsed && Array.isArray(parsed.students) && Array.isArray(parsed.classes)) appState = parsed;
                }
            } catch (e) {
                console.warn('Local storage cache read error:', e);
            }
            activeRole = 'teacher';
            normalizeAppState();
            cleanupExpiredStudentMessages();
            persistLocalState();
            const app = document.getElementById('main-app-container');
            if (app) app.style.display = 'flex';
            updateStatsBar();
            switchTab(1);
            setInterval(() => {
                const before = (appState.studentMessages || []).length;
                cleanupExpiredStudentMessages();
                if ((appState.studentMessages || []).length !== before) persistLocalState();
            }, 60 * 60 * 1000);
        };
    </script>
</body>
</html>
